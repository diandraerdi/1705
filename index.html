  :root{

    --accent-text:#CCF180;

    --red:#FF453A;
    --red-tint: rgba(255,69,58,0.2);

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  #bottomNav{

  }
  #bottomNav.nav-hidden{ transform: translateY(110px); opacity:0; pointer-events:none; }
  .nav-item{
    flex:0 0 auto; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:0;
    background:none; border:none; color: var(--label-tertiary); font-family:inherit;

  #pageInner.slide-out-right{ transform: translateX(18px); opacity:0; }

  /* Balance card */

  }

  /* Section headers */

  .section-title{ font-size:18px; font-weight:700; letter-spacing:-0.3px; min-width:0; }

  /* Accounts row */

  .account-card{

  }

  }
  .add-account-full:active{ transform: scale(0.98); }

  /* Person spend cards */
  .spend-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .expenses-subrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin: 12px 0 12px 0; }
  .period-nav{ display:flex; align-items:center; gap:8px; }
  .period-btn{ width:26px; height:26px; border-radius:50%; background:var(--bg-elevated); border:none; color:var(--label-secondary); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .period-btn:disabled{ opacity:0.3; cursor:default; }
  .period-btn:not(:disabled):active{ transform: scale(0.9); }
  .period-label{ font-size:11.5px; font-weight:600; color:var(--label); white-space:nowrap; }

  .chart-card{ background: var(--bg-elevated); border-radius:16px; padding:18px 14px 14px 14px; }

  .legend{ display:flex; justify-content:center; gap:14px; margin-top:16px; }

  .pie-card{ background: var(--bg-elevated); border-radius:16px; padding:20px 16px; }

  .legend-amt{ font-size:12px; font-weight:600; color: var(--label); text-align:right; flex-shrink:0; }

  .period-nav-sheet{ display:flex; align-items:center; justify-content:space-between; margin: 4px 0 18px 0; }
  .period-btn-lg{ width:40px; height:40px; border-radius:50%; background: var(--bg-elevated-2); border:none; color: var(--label); font-size:19px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .more-btn{ width:100%; padding:13px; background: var(--bg-elevated); color: var(--accent-text); border:none; border-radius:14px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:2px; }

  .chip-filter-row{ display:flex; gap:8px; margin-bottom:14px; }

  .history-header{ display:flex; align-items:center; gap:10px; padding: 6px 2px 20px 2px; position:relative; }
  .back-btn{ display:flex; align-items:center; gap:2px; background:none; border:none; color: var(--accent-text); font-size:13px; font-weight:600; cursor:pointer; padding:4px 4px 4px 0; font-family:inherit; }
  .history-title{ font-size:17px; font-weight:700; position:absolute; left:50%; transform:translateX(-50%); }
  .history-toolbar{ display:flex; gap:8px; margin-bottom:12px; }
  .search-input{ flex:1; background: var(--bg-elevated); border:none; border-radius:12px; padding:11px 14px; color: var(--label); font-size:14px; font-family:inherit; }

  .filter-icon-btn{ width:40px; height:40px; flex-shrink:0; border-radius:12px; background: var(--bg-elevated); border:none; color: var(--label-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* Budgets */

  /* FAB */

  .btn-primary{

  .btn-secondary{
    width:100%; padding:15px; background: var(--bg-elevated-2); color: var(--label); border:none; border-radius:14px;
    font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:10px;

// ---------- THEME ----------
function getThemePref(){
  try{ return localStorage.getItem('theme-preference') || 'system'; }catch(e){ return 'system'; }
}
function resolveTheme(pref){
  if(pref === 'light' || pref === 'dark') return pref;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}
function applyTheme(pref){
  const root = document.documentElement;
  if(pref === 'light'){ root.setAttribute('data-theme','light'); }
  else if(pref === 'dark'){ root.setAttribute('data-theme','dark'); }
  else { root.removeAttribute('data-theme'); }
  const meta = document.getElementById('themeColorMeta');
  if(meta) meta.setAttribute('content', resolveTheme(pref) === 'light' ? '#EEF6E2' : '#084734');
}
function setThemePref(pref){
  try{ localStorage.setItem('theme-preference', pref); }catch(e){}
  applyTheme(pref);
}
applyTheme(getThemePref());
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
    if(getThemePref() === 'system') applyTheme('system');
  });
}

let db = null;

let state = defaultState();
let ui = { tab: 'finance', showBalance: false, view: 'home', spendFilter: { range: 'this_month', customStart: null, customEnd: null, categories: [] }, historyFilter: { query: '', range: 'all', customStart: null, customEnd: null, person: null, type: null, categories: [] }, foodFilter: 'unused', expenseTab: 'summary', trendOffset: 0 };

function defaultState(){

    accounts: [], transactions: [], budgets: [],
    settings: { person1: 'Me', person2: 'Wife', currency: 'Rp' },
    categories: {
      expense: DEFAULT_EXPENSE_CATS.map(c=>Object.assign({}, c)),

// ===== SYNC CORE START =====
let docRef = null;
let unsubscribeSnapshot = null;
let hasSyncedOnce = false;
let recoveryPromptShown = false;
let lastSyncedState = null;   // last copy of the shared document the server is known to have (includes _rev)
let saveInFlight = false;
let saveRequested = false;
let pendingApplied = false;
let retryTimer = null;
let loadStatus = 'loading';   // loading | slow | offline | error  (only matters until the first sync)
let loadSlowTimer = null;
let lastSyncedAt = 0;        // when this phone last knew it matched the server
let lastSaveFailed = false;  // true after a save attempt failed, until one succeeds

const PENDING_KEY = 'pending-save-v1';

function looksLikeRealData(s){
  return !!s && (
    (s.accounts && s.accounts.length > 0) ||
    (s.transactions && s.transactions.length > 0) ||
    (s.foodItems && s.foodItems.length > 0)
  );
}

function cloneData(o){ return JSON.parse(JSON.stringify(o)); }

// Compares two pieces of data directly (object key order does not matter, list order does). Stops at the first difference.
function deepEqual(a, b){
  if(a === b) return true;
  if(a && b && typeof a === 'object' && typeof b === 'object'){
    const arrA = Array.isArray(a);
    if(arrA !== Array.isArray(b)) return false;
    if(arrA){
      if(a.length !== b.length) return false;
      for(let i = 0; i < a.length; i++){ if(!deepEqual(a[i], b[i])) return false; }
      return true;
    }
    const ka = Object.keys(a).filter(k=>a[k] !== undefined);
    const kb = Object.keys(b).filter(k=>b[k] !== undefined);
    if(ka.length !== kb.length) return false;
    for(let i = 0; i < ka.length; i++){
      const k = ka[i];
      if(b[k] === undefined || !deepEqual(a[k], b[k])) return false;
    }
    return true;
  }
  return false;
}

function withoutRev(o){ const c = Object.assign({}, o); delete c._rev; return c; }
function sameContent(a, b){ return deepEqual(withoutRev(a || {}), withoutRev(b || {})); }

// ---- What the "Saved" indicator reports ----
function notifySyncStatus(){
  if(typeof onSyncStatus === 'function'){ try{ onSyncStatus(); }catch(e){} }
}
// How many things on this phone the server has not got yet (added, changed or removed).
function countPendingChanges(base, local){
  base = base || defaultState(); local = local || {};
  let n = 0;
  const diffById = (b, l)=>{
    const bm = new Map((b || []).map(x=>[x.id, x]));
    const lm = new Map((l || []).map(x=>[x.id, x]));
    lm.forEach((item, id)=>{ const o = bm.get(id); if(!o || !deepEqual(o, item)) n++; });
    bm.forEach((o, id)=>{ if(!lm.has(id)) n++; });
  };
  ['accounts', 'transactions', 'budgets', 'foodItems', 'recurring'].forEach(k=>diffById(base[k], local[k]));
  diffById((base.categories || {}).expense, (local.categories || {}).expense);
  diffById((base.categories || {}).income, (local.categories || {}).income);
  Object.keys(local.settings || {}).forEach(k=>{ if(!deepEqual((base.settings || {})[k], local.settings[k])) n++; });
  return n;
}
function getSyncStatus(){
  const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
  if(!hasSyncedOnce) return { state: 'connecting', pending: 0, offline, lastSyncedAt };
  const pending = lastSyncedState ? countPendingChanges(withoutRev(lastSyncedState), state) : 0;
  let st = 'saved';
  if(saveInFlight) st = 'saving';
  else if(pending > 0) st = offline ? 'offline' : (lastSaveFailed ? 'error' : 'waiting');
  return { state: st, pending, offline, lastSyncedAt };
}

// ---- Three-way merge: server + (what THIS device changed since it last synced) ----
function mergeAccount(base, local, server){
  const out = Object.assign({}, server);
  ['name', 'type'].forEach(k=>{ if(local[k] !== base[k]) out[k] = local[k]; });
  // Balances are merged as a delta, so two phones adjusting the same account both count.
  out.balance = Number(server.balance || 0) + (Number(local.balance || 0) - Number(base.balance || 0));
  return out;
}

function mergeById(baseArr, localArr, serverArr, mergeItem){
  const baseMap = new Map((baseArr || []).map(x=>[x.id, x]));
  const localArr2 = localArr || [];
  const localMap = new Map(localArr2.map(x=>[x.id, x]));
  const out = (serverArr || []).slice();                 // start from what the server has, in its order
  const at = (id)=> out.findIndex(x=>x.id === id);
  // items this device deleted
  baseMap.forEach((b, id)=>{ if(!localMap.has(id)){ const i = at(id); if(i >= 0) out.splice(i, 1); } });
  // items this device added or edited (in this device's order, so an undone delete returns to its old spot)
  localArr2.forEach((l, li)=>{
    const b = baseMap.get(id_(l));
    if(b && deepEqual(b, l)) return;                                     // untouched here: keep the server's version
    const i = at(l.id);
    if(!b){
      if(i >= 0) return;                                                 // already on the server
      let pos = 0;                                                       // go right after the nearest earlier item we both have
      for(let k = li - 1; k >= 0; k--){ const pi = at(localArr2[k].id); if(pi >= 0){ pos = pi + 1; break; } }
      out.splice(pos, 0, l);
      return;
    }
    if(i >= 0) out[i] = mergeItem ? mergeItem(b, l, out[i]) : l;        // edited here (if the other phone deleted it, leave it deleted)
  });
  return out;
}
function id_(x){ return x.id; }

function mergeSettings(base, local, server){
  const out = Object.assign({}, server);
  Object.keys(local || {}).forEach(k=>{
    if(!deepEqual((base || {})[k], local[k])) out[k] = local[k];
  });
  return out;
}

function mergeStates(base, local, server){
  const b = Object.assign(defaultState(), base || {});
  const l = Object.assign(defaultState(), local || {});
  const s = Object.assign(defaultState(), server || {});
  const out = Object.assign({}, s);
  out.accounts = mergeById(b.accounts, l.accounts, s.accounts, mergeAccount);
  out.transactions = mergeById(b.transactions, l.transactions, s.transactions);
  out.budgets = mergeById(b.budgets, l.budgets, s.budgets);
  out.foodItems = mergeById(b.foodItems, l.foodItems, s.foodItems);
  out.recurring = mergeById(b.recurring, l.recurring, s.recurring);
  out.settings = mergeSettings(b.settings, l.settings, s.settings);
  out.categories = {
    expense: mergeById((b.categories || {}).expense, (l.categories || {}).expense, (s.categories || {}).expense),
    income: mergeById((b.categories || {}).income, (l.categories || {}).income, (s.categories || {}).income)
  };
  delete out._rev;
  return out;
}

// ---- Changes that could not be saved yet (offline etc.) survive an app restart ----
function savePending(base, local){
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify({ base, local })); }catch(e){}
}
function loadPending(){
  try{ const raw = localStorage.getItem(PENDING_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearPending(){
  try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
}

// ---- Receiving data from the server ----
// Returns true if the screen needs a re-render.
function applyIncoming(raw){
  raw = raw || {};
  const incoming = Object.assign(defaultState(), raw);
  if(lastSyncedState && raw._rev !== undefined && (raw._rev || 0) <= (lastSyncedState._rev || 0)) return false; // already have this or newer

  const base = lastSyncedState ? withoutRev(lastSyncedState) : defaultState();
  const pending = pendingApplied ? null : loadPending();
  pendingApplied = true;

  let newState;
  if(pending && pending.local){
    newState = mergeStates(pending.base, pending.local, incoming);
  } else if(!sameContent(state, base)){
    // this device has changes the server hasn't seen yet — keep them on top of the new data
    newState = mergeStates(base, state, incoming);
  } else {
    newState = withoutRev(incoming);
  }

  lastSyncedState = cloneData(incoming);
  const changed = !sameContent(newState, state);
  if(changed) state = newState;
  if(sameContent(newState, incoming)) lastSyncedAt = Date.now(); else scheduleSave();
  notifySyncStatus();
  return changed;
}

function handleServerDoc(doc){
  const fromCache = !!(doc.metadata && doc.metadata.fromCache);
  const raw = doc.exists ? doc.data() : {};
  const incoming = Object.assign(defaultState(), raw);

  if(!fromCache && !looksLikeRealData(incoming) && looksLikeRealData(state) && !recoveryPromptShown){
    // Server says empty, but this device is holding real-looking data. Don't silently overwrite it.
    recoveryPromptShown = true;
    hasSyncedOnce = true;
    showRecoveryPrompt(state, raw);
    return;
  }
  if(saveInFlight) return; // our own save refreshes from the server when it finishes

  const firstTime = !hasSyncedOnce;
  hasSyncedOnce = true;
  clearTimeout(loadSlowTimer);
  if(firstTime && typeof onFirstSync === 'function') onFirstSync();
  const changed = applyIncoming(raw);
  if(!fromCache) clearSetupBanner();
  if(changed || firstTime) render();
}

async function refreshFromServer(){
  if(!docRef || saveInFlight || !hasSyncedOnce) return;
  try{
    const snap = await docRef.get({ source: 'server' });
    handleServerDoc(snap);
  }catch(e){ /* offline or transient — the live listener will catch up */ }
}

async function loadState(){
  if(!FIREBASE_CONFIGURED){
    showSetupBanner();
    render();
    return;
  }
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  lastSyncedState = null; hasSyncedOnce = false; recoveryPromptShown = false; pendingApplied = false; saveRequested = false;
  loadStatus = 'loading';
  lastSyncedAt = 0; lastSaveFailed = false;
  clearTimeout(loadSlowTimer);
  loadSlowTimer = setTimeout(()=>{
    if(hasSyncedOnce || !unsubscribeSnapshot) return;
    loadStatus = (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'offline' : 'slow';
    render();
  }, 7000);
  docRef = db.collection('family-finance').doc('shared-data');
  unsubscribeSnapshot = docRef.onSnapshot((doc)=>{
    handleServerDoc(doc);
  }, (err)=>{
    console.error('Sync error', err);
    loadStatus = 'error';
    clearTimeout(loadSlowTimer);
    showSetupBanner('Could not connect. Check your Firestore security rules.');
    render();
  });
}

// ---- Saving: always merge into the LATEST server copy, never overwrite it ----
function scheduleSave(){
  saveRequested = true;
  if(!saveInFlight) runSaveLoop();
}

function saveState(){
  if(!FIREBASE_CONFIGURED || !db) return;
  if(!hasSyncedOnce){
    console.warn('Blocked a save: the first sync from Firestore has not completed yet, so local state cannot be trusted to write.');
    showSetupBanner('Still connecting — please wait a moment before making changes.');
    return;
  }
  scheduleSave();
}

function scheduleRetry(){
  if(retryTimer) return;
  retryTimer = setTimeout(()=>{ retryTimer = null; flushIfDirty(); }, 20000);
}

function flushIfDirty(){
  if(!hasSyncedOnce || saveInFlight || !lastSyncedState) return;
  if(!sameContent(state, lastSyncedState) || loadPending()) scheduleSave();
}

async function runSaveLoop(){
  saveInFlight = true;
  notifySyncStatus();
  try{
    while(saveRequested){
      saveRequested = false;
      const snapshotLocal = cloneData(state);
      const base = lastSyncedState ? withoutRev(cloneData(lastSyncedState)) : defaultState();

      if(typeof navigator !== 'undefined' && navigator.onLine === false){
        savePending(base, snapshotLocal);
        showSetupBanner("You're offline — your changes are kept on this device and will sync when you're back online.");
        break;
      }

      let committed;
      try{
        committed = await db.runTransaction(async (tx)=>{
          const snap = await tx.get(docRef);
          const serverRaw = snap.exists ? snap.data() : {};
          const merged = mergeStates(base, snapshotLocal, Object.assign(defaultState(), serverRaw));
          const payload = Object.assign(cloneData(merged), { _rev: (serverRaw._rev || 0) + 1 });
          tx.set(docRef, payload);
          return payload;
        });
      }catch(e){
        console.error('Save failed', e);
        lastSaveFailed = true;
        savePending(base, snapshotLocal);
        showSetupBanner('Could not save right now — your changes are kept on this device and will retry automatically.');
        scheduleRetry();
        break;
      }

      clearPending();
      clearSetupBanner();
      lastSaveFailed = false; lastSyncedAt = Date.now();
      lastSyncedState = cloneData(committed);
      // fold in anything the other phone changed, and anything we changed while this save was running
      const rebased = mergeStates(snapshotLocal, state, withoutRev(committed));
      if(!sameContent(rebased, state)){ state = rebased; render(); }
    }
  } finally {
    saveInFlight = false;
    notifySyncStatus();
  }
  refreshFromServer();
}

// Catch up whenever the app returns to the foreground or the connection comes back
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){ refreshFromServer(); flushIfDirty(); }
});
window.addEventListener('online', ()=>{ notifySyncStatus(); flushIfDirty(); refreshFromServer(); });
window.addEventListener('offline', ()=>{ notifySyncStatus(); });
window.addEventListener('pageshow', ()=>{ refreshFromServer(); flushIfDirty(); });

// ---- Restore: replaces the whole shared document with a backup (deliberate, not merged) ----
async function restoreFromBackup(data){
  if(!FIREBASE_CONFIGURED || !db || !docRef || !hasSyncedOnce) throw new Error('not-ready');
  if(saveInFlight) throw new Error('busy');
  saveInFlight = true; // keeps normal saves and refreshes out of the way while we replace everything
  try{
    const payload = await db.runTransaction(async (tx)=>{
      const snap = await tx.get(docRef);
      const serverRev = snap.exists ? ((snap.data()._rev) || 0) : 0;
      const p = Object.assign(cloneData(Object.assign(defaultState(), data)), { _rev: serverRev + 1 });
      tx.set(docRef, p);
      return p;
    });
    clearPending();
    saveRequested = false;
    lastSyncedState = cloneData(payload);
    state = withoutRev(cloneData(payload));
    lastSaveFailed = false; lastSyncedAt = Date.now();
  } finally {
    saveInFlight = false;
    notifySyncStatus();
  }
  render();
}

const APP_VERSION = '24';
const BACKUP_APP_ID = '1705-finance';
const LAST_BACKUP_KEY = 'last-backup-at';
const BACKUP_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function pad2(n){ return String(n).padStart(2, '0'); }
function localDateStamp(d){ d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function backupFileName(prefix, ext){ return '1705-finance-' + prefix + '-' + localDateStamp() + '.' + ext; }

// Checks a backup strictly, so a damaged or wrong file can never overwrite real data.
function normalizeBackupData(raw){
  const fail = (msg)=>({ ok: false, error: msg });
  const isObj = (v)=> !!v && typeof v === 'object' && !Array.isArray(v);
  const str = (v)=> typeof v === 'string' && v.length > 0;
  const numeric = (v)=> (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(Number(v));

  if(!isObj(raw) || !Array.isArray(raw.accounts) || !Array.isArray(raw.transactions)){
    return fail("This doesn't look like a 1705 Finance backup (accounts or transactions are missing).");
  }
  const d = defaultState();
  const out = { accounts: [], transactions: [], budgets: [], foodItems: [], recurring: [] };
  const uniqueTracker = ()=>{ const ids = new Set(); return (id)=>{ if(ids.has(id)) return false; ids.add(id); return true; }; };

  let uniq = uniqueTracker();
  for(let i = 0; i < raw.accounts.length; i++){
    const a = raw.accounts[i];
    if(!isObj(a) || !str(a.id) || !str(a.name) || !numeric(a.balance)) return fail('Account #' + (i + 1) + ' is incomplete or damaged.');
    if(!uniq(a.id)) return fail('Account #' + (i + 1) + ' appears twice in the file.');
    out.accounts.push(Object.assign({}, a, { balance: Number(a.balance), type: str(a.type) ? a.type : 'Regular Savings' }));
  }

  uniq = uniqueTracker();
  for(let i = 0; i < raw.transactions.length; i++){
    const t = raw.transactions[i];
    if(!isObj(t) || !str(t.id)) return fail('Transaction #' + (i + 1) + ' has no valid id.');
    if(t.type !== 'expense' && t.type !== 'income') return fail('Transaction #' + (i + 1) + ' has an unknown type.');
    if(!numeric(t.amount)) return fail('Transaction #' + (i + 1) + ' has no valid amount.');
    if(!str(t.date) || !BACKUP_DATE_RE.test(t.date)) return fail('Transaction #' + (i + 1) + ' has no valid date.');
    if(!str(t.category)) return fail('Transaction #' + (i + 1) + ' has no category.');
    if(t.person !== 'p1' && t.person !== 'p2') return fail('Transaction #' + (i + 1) + ' has an unknown person.');
    if(!uniq(t.id)) return fail('Transaction #' + (i + 1) + ' appears twice in the file.');
    out.transactions.push(Object.assign({}, t, {
      amount: Number(t.amount),
      note: typeof t.note === 'string' ? t.note : '',
      accountId: str(t.accountId) ? t.accountId : null
    }));
  }

  uniq = uniqueTracker();
  const budgets = Array.isArray(raw.budgets) ? raw.budgets : [];
  for(let i = 0; i < budgets.length; i++){
    const b = budgets[i];
    if(!isObj(b) || !str(b.id) || !str(b.category) || !numeric(b.limit)) return fail('Budget #' + (i + 1) + ' is incomplete or damaged.');
    if(!uniq(b.id)) return fail('Budget #' + (i + 1) + ' appears twice in the file.');
    out.budgets.push(Object.assign({}, b, { limit: Number(b.limit) }));
  }

  uniq = uniqueTracker();
  const food = Array.isArray(raw.foodItems) ? raw.foodItems : [];
  for(let i = 0; i < food.length; i++){
    const f = food[i];
    if(!isObj(f) || !str(f.id) || !str(f.name)) return fail('Food item #' + (i + 1) + ' is incomplete or damaged.');
    if(!str(f.expiryDate) || !BACKUP_DATE_RE.test(f.expiryDate)) return fail('Food item #' + (i + 1) + ' has no valid expiry date.');
    if(!uniq(f.id)) return fail('Food item #' + (i + 1) + ' appears twice in the file.');
    out.foodItems.push(Object.assign({}, f, { used: !!f.used, amount: typeof f.amount === 'string' ? f.amount : '' }));
  }

  uniq = uniqueTracker();
  const recurring = Array.isArray(raw.recurring) ? raw.recurring : [];
  for(let i = 0; i < recurring.length; i++){
    const r = recurring[i];
    const label = 'Recurring entry #' + (i + 1);
    if(!isObj(r) || !str(r.id)) return fail(label + ' has no valid id.');
    if(r.type !== 'expense' && r.type !== 'income') return fail(label + ' has an unknown type.');
    if(!numeric(r.amount)) return fail(label + ' has no valid amount.');
    if(!str(r.category)) return fail(label + ' has no category.');
    if(r.person !== 'p1' && r.person !== 'p2') return fail(label + ' has an unknown person.');
    if(r.repeat !== 'monthly' && r.repeat !== 'days') return fail(label + ' has an unknown repeat pattern.');
    if(r.repeat === 'monthly' && !(numeric(r.day) && Number(r.day) >= 1 && Number(r.day) <= 31)) return fail(label + ' has no valid day of month.');
    if(r.repeat === 'days' && !(numeric(r.every) && Number(r.every) >= 1)) return fail(label + ' has no valid interval.');
    if(!str(r.nextDue) || !BACKUP_DATE_RE.test(r.nextDue)) return fail(label + ' has no valid next due date.');
    if(!uniq(r.id)) return fail(label + ' appears twice in the file.');
    out.recurring.push(Object.assign({}, r, {
      amount: Number(r.amount), note: typeof r.note === 'string' ? r.note : '',
      accountId: str(r.accountId) ? r.accountId : null,
      day: numeric(r.day) ? Number(r.day) : 1, every: numeric(r.every) ? Number(r.every) : 1
    }));
  }

  const s = isObj(raw.settings) ? raw.settings : {};
  out.settings = Object.assign({}, d.settings);
  ['person1', 'person2', 'currency'].forEach(k=>{ if(str(s[k])) out.settings[k] = s[k]; });

  const goodCats = (arr)=> Array.isArray(arr) && arr.length > 0 && arr.every(c=> isObj(c) && str(c.id) && str(c.label) && typeof c.icon === 'string');
  const rc = isObj(raw.categories) ? raw.categories : {};
  out.categories = {
    expense: goodCats(rc.expense) ? rc.expense.map(c=>Object.assign({}, c)) : d.categories.expense,
    income: goodCats(rc.income) ? rc.income.map(c=>Object.assign({}, c)) : d.categories.income
  };
  return { ok: true, data: out };
}

function parseBackupText(text){
  let obj;
  try{ obj = JSON.parse(text); }
  catch(e){ return { ok: false, error: "This file can't be read — it isn't a valid backup." }; }
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, error: "This file isn't a valid backup." };
  const raw = (obj.data && typeof obj.data === 'object') ? obj.data : obj;
  const checked = normalizeBackupData(raw);
  if(!checked.ok) return checked;
  return { ok: true, data: checked.data, meta: { exportedAt: obj.exportedAt || null, appVersion: obj.appVersion || null } };
}

// ---- Getting a file off the phone: share sheet first (Save to Files, Drive, WhatsApp...), download as fallback ----
async function deliverFile(filename, mimeType, text){
  const types = [mimeType];
  if(mimeType !== 'text/plain') types.push('text/plain');
  try{
    for(const type of types){
      const file = new File([text], filename, { type });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: filename });
        return 'shared';
      }
    }
  }catch(e){
    if(e && e.name === 'AbortError') return 'cancelled';
    /* anything else: fall back to a normal download */
  }
  const url = URL.createObjectURL(new Blob([text], { type: mimeType }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return 'downloaded';
}

function backupStatus(){

  if(days <= 0) return { text: 'Today', stale: false };
  if(days === 1) return { text: 'Yesterday', stale: false };

}

// ---- date helpers (all dates are plain "YYYY-MM-DD" text, in local time) ----
function isoDate(y, m, d){ return y + '-' + pad2(m) + '-' + pad2(d); }
function todayISO(now){ now = now || new Date(); return isoDate(now.getFullYear(), now.getMonth() + 1, now.getDate()); }
function parseISODate(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDaysISO(s, n){ const d = parseISODate(s); d.setDate(d.getDate() + n); return isoDate(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
function daysInMonthOf(y, m){ return new Date(y, m, 0).getDate(); }

// ---- recurring entries ----
// the occurrence that comes AFTER fromISO
function nextOccurrence(item, fromISO){
  if(item.repeat === 'days') return addDaysISO(fromISO, Math.max(1, Math.round(Number(item.every)) || 1));
  const p = fromISO.split('-').map(Number);
  let y = p[0], m = p[1] + 1;
  if(m > 12){ m = 1; y++; }
  const want = Math.min(31, Math.max(1, Math.round(Number(item.day)) || p[2]));
  return isoDate(y, m, Math.min(want, daysInMonthOf(y, m))); // 31st in a 30-day month -> 30th, but the wish stays 31
}
// first occurrence that is today or later
function firstDueDate(repeat, day, every, now){
  const t = todayISO(now);
  if(repeat === 'days') return addDaysISO(t, Math.max(1, Math.round(Number(every)) || 1));
  const today = parseISODate(t);
  const want = Math.min(31, Math.max(1, Math.round(Number(day)) || today.getDate()));
  const y = today.getFullYear(), m = today.getMonth() + 1;
  const thisMonth = isoDate(y, m, Math.min(want, daysInMonthOf(y, m)));
  if(thisMonth >= t) return thisMonth;
  return nextOccurrence({ repeat: 'monthly', day: want }, thisMonth);
}
// first occurrence strictly after afterISO that is not in the past (used by "repeat this entry")
function firstDueAfter(item, afterISO, now){
  const t = todayISO(now);
  let d = nextOccurrence(item, afterISO);
  let guard = 0;
  while(d < t && guard++ < 400) d = nextOccurrence(item, d);
  return d;
}
function dueRecurring(list, now){
  const t = todayISO(now);
  return (list || []).filter(r => r && r.nextDue && r.nextDue <= t).sort((a, b) => a.nextDue < b.nextDue ? -1 : a.nextDue > b.nextDue ? 1 : 0);
}
function describeRepeat(r){
  if(r.repeat === 'days'){
    const n = Math.max(1, Math.round(Number(r.every)) || 1);
    if(n === 1) return 'Daily';
    if(n === 7) return 'Weekly';
    if(n === 14) return 'Every 2 weeks';
    return 'Every ' + n + ' days';
  }
  return 'Monthly · day ' + (r.day || '?');
}

// ---- suggestions for the "To / From" field ----
function mostUsedKey(counts, order){
  let best = null, bestN = 0;
  (order || Object.keys(counts)).forEach(k=>{ if((counts[k] || 0) > bestN){ best = k; bestN = counts[k]; } });
  return best;
}
// the category you use most for this kind of entry (ties go to the earlier one in the list)
function mostUsedCategory(transactions, type, catList){
  const counts = {};
  (transactions || []).forEach(t=>{ if(t.type === type) counts[t.category] = (counts[t.category] || 0) + 1; });
  const ids = (catList || []).map(c=>c.id);
  return mostUsedKey(counts, ids) || (ids.length ? ids[0] : null);
}
function noteSuggestions(transactions, type, query, validCatIds, limit){
  const q = String(query || '').trim().toLowerCase();
  const stats = new Map();
  (transactions || []).forEach(t=>{
    if(t.type !== type) return;
    const note = String(t.note || '').trim();
    if(!note) return;
    const key = note.toLowerCase();
    let s = stats.get(key);
    if(!s){ s = { note, count: 0, lastDate: '', lastCreated: 0, lastAmount: 0, cats: {} }; stats.set(key, s); }
    s.count++;
    s.cats[t.category] = (s.cats[t.category] || 0) + 1;
    const when = String(t.date || ''), created = Number(t.createdAt || 0);
    if(when > s.lastDate || (when === s.lastDate && created >= s.lastCreated)){
      s.lastDate = when; s.lastCreated = created; s.lastAmount = Number(t.amount); s.note = note;
    }
  });
  let list = Array.from(stats.values());
  if(q) list = list.filter(s => s.note.toLowerCase().includes(q));
  list.sort((a, b)=>{
    if(q){
      const as = a.note.toLowerCase().startsWith(q) ? 1 : 0, bs = b.note.toLowerCase().startsWith(q) ? 1 : 0;
      if(as !== bs) return bs - as;
    }
    if(b.count !== a.count) return b.count - a.count;
    return a.lastDate < b.lastDate ? 1 : a.lastDate > b.lastDate ? -1 : 0;
  });
  const ok = new Set(validCatIds || []);
  return list.slice(0, limit || 5).map(s=>{
    const cat = mostUsedKey(s.cats);
    return { note: s.note, count: s.count, amount: s.lastAmount, category: (cat && (!validCatIds || ok.has(cat))) ? cat : null };
  });
}

// ---- budget pace ----
function budgetPace(limit, spent, now){
  now = now || new Date();
  limit = Number(limit) || 0; spent = Number(spent) || 0;
  const dim = daysInMonthOf(now.getFullYear(), now.getMonth() + 1);
  const day = now.getDate();
  const daysLeft = dim - day + 1;                       // today still counts
  const remaining = limit - spent;
  const projected = day >= 3 ? Math.round(spent / day * dim) : null;   // too early in the month to predict
  let status = 'ok';
  if(spent >= limit) status = 'over';
  else if(projected !== null && projected > limit) status = 'warn';
  return {
    limit, spent, remaining, day, dim, daysLeft, status, projected,
    expectedPct: day / dim,
    over: Math.max(0, spent - limit),
    projectedOver: projected !== null ? Math.max(0, projected - limit) : 0,
    perDay: remaining > 0 ? Math.floor(remaining / daysLeft) : 0
  };
}

// ---- "is there a newer version online?" ----
function parseRemoteVersion(htmlText){
  const m = /const APP_VERSION = '(\d+)'/.exec(String(htmlText || ''));
  return m ? Number(m[1]) : null;
}
function isNewerVersion(remote, local){
  return remote !== null && remote !== undefined && isFinite(remote) && Number(remote) > Number(local);
}

// ---- food: how long did this last time? (shelf life, in days from buying) ----
function suggestShelfLifeDays(name, foodItems){
  const key = String(name || '').trim().toLowerCase();
  if(!key) return null;
  let best = null;
  (foodItems || []).forEach(f=>{
    if(String(f.name || '').trim().toLowerCase() !== key || !f.createdAt || !f.expiryDate) return;
    const bought = new Date(f.createdAt);
    const days = Math.round((parseISODate(f.expiryDate) - parseISODate(isoDate(bought.getFullYear(), bought.getMonth() + 1, bought.getDate()))) / 86400000);
    if(days < 1 || days > 800) return;
    if(!best || f.createdAt > best.createdAt) best = { days, createdAt: f.createdAt };
  });
  return best ? best.days : null;
}

// ---- month helpers ----
function monthStartISO(y, m){ return isoDate(y, m, 1); }
function monthEndISO(y, m){ return isoDate(y, m, daysInMonthOf(y, m)); }
function prevMonthOf(y, m){ return m === 1 ? { y: y - 1, m: 12 } : { y: y, m: m - 1 }; }
function monthLabel(y, m){ return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); }
function monthName(m){ return new Date(2000, m - 1, 1).toLocaleDateString('en-GB', { month: 'long' }); }
function earliestMonth(transactions){
  let min = null;
  (transactions || []).forEach(t=>{ if(t && /^\d{4}-\d{2}-\d{2}$/.test(t.date || '') && (!min || t.date < min)) min = t.date; });
  return min ? { y: Number(min.slice(0, 4)), m: Number(min.slice(5, 7)) } : null;
}

// ---- "vs last month" ----
// The stretch of time the Summary filter covers. Periods that are still running end today.
function periodBounds(filter, now){
  now = now || new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1, today = todayISO(now);
  if(filter.range === 'last_month'){ const p = prevMonthOf(y, m); return { start: monthStartISO(p.y, p.m), end: monthEndISO(p.y, p.m) }; }
  if(filter.range === 'this_year') return { start: isoDate(y, 1, 1), end: today };
  if(filter.range === 'custom'){
    return (filter.customStart && filter.customEnd && filter.customStart <= filter.customEnd) ? { start: filter.customStart, end: filter.customEnd } : null;
  }
  return { start: monthStartISO(y, m), end: today };
}
// The matching earlier stretch, like for like (same number of days).
function previousPeriod(filter, now){
  now = now || new Date();
  const b = periodBounds(filter, now);
  if(!b) return null;
  const y = now.getFullYear(), m = now.getMonth() + 1;
  if(filter.range === 'last_month'){
    const p = prevMonthOf(y, m), pp = prevMonthOf(p.y, p.m);
    return { start: monthStartISO(pp.y, pp.m), end: monthEndISO(pp.y, pp.m), label: 'month before', short: 'month before' };
  }
  if(filter.range === 'this_year'){
    return { start: isoDate(y - 1, 1, 1), end: isoDate(y - 1, m, Math.min(now.getDate(), daysInMonthOf(y - 1, m))), label: 'same period last year', short: 'last year' };
  }
  if(filter.range === 'custom'){
    const len = Math.round((parseISODate(b.end) - parseISODate(b.start)) / 86400000) + 1;
    const end = addDaysISO(b.start, -1);
    return { start: addDaysISO(end, -(len - 1)), end, label: 'previous period', short: 'previous period' };
  }
  const p = prevMonthOf(y, m);
  return { start: monthStartISO(p.y, p.m), end: isoDate(p.y, p.m, Math.min(now.getDate(), daysInMonthOf(p.y, p.m))), label: 'same days last month', short: 'last month' };
}
function spendByPerson(transactions, startISO, endISO, categories){
  const out = { all: 0, p1: 0, p2: 0 };
  (transactions || []).forEach(t=>{
    if(!t || t.type !== 'expense' || !t.date || t.date < startISO || t.date > endISO) return;
    if(categories && categories.length && !categories.includes(t.category)) return;
    const a = Number(t.amount) || 0;
    out.all += a;
    if(t.person === 'p1') out.p1 += a; else if(t.person === 'p2') out.p2 += a;
  });
  return out;
}
function pctChange(cur, prev){ return prev > 0 ? (cur - prev) / prev * 100 : null; }
function describeChange(pct){
  if(pct === null || pct === undefined || !isFinite(pct)) return null;
  const r = Math.round(Math.abs(pct));
  if(r < 1) return { arrow: '≈', text: 'about the same', tone: 'flat', pct: 0 };
  return pct > 0 ? { arrow: '▲', text: r + '%', tone: 'up', pct: r } : { arrow: '▼', text: r + '%', tone: 'down', pct: -r };
}
function comparePeriods(transactions, filter, now){
  now = now || new Date();
  const b = periodBounds(filter, now), prev = previousPeriod(filter, now);
  if(!b || !prev) return null;
  if((!filter.range || filter.range === 'this_month') && now.getDate() < 3) return null;   // 1-2 days is too little to compare
  const cats = filter.categories || [];
  const cur = spendByPerson(transactions, b.start, b.end, cats), old = spendByPerson(transactions, prev.start, prev.end, cats);
  const make = (k)=>({ cur: cur[k], prev: old[k], change: describeChange(pctChange(cur[k], old[k])) });
  return { label: prev.label, short: prev.short, all: make('all'), p1: make('p1'), p2: make('p2') };
}

// ---- top places (grouped by the "To" name) ----
function topPlaces(transactions, startISO, endISO, limit){
  const map = new Map();
  let total = 0, unnamed = 0, unnamedCount = 0;
  (transactions || []).forEach(t=>{
    if(!t || t.type !== 'expense' || !t.date || t.date < startISO || t.date > endISO) return;
    const amt = Number(t.amount) || 0;
    total += amt;
    const name = String(t.note || '').trim();
    if(!name){ unnamed += amt; unnamedCount++; return; }
    const key = name.toLowerCase();
    let p = map.get(key);
    if(!p){ p = { name, total: 0, count: 0, lastDate: '' }; map.set(key, p); }
    p.total += amt; p.count++;
    if(t.date >= p.lastDate){ p.lastDate = t.date; p.name = name; }
  });
  const list = Array.from(map.values()).sort((a, b)=> b.total - a.total || b.count - a.count || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  return {
    places: list.slice(0, limit || 5).map(p=>({ name: p.name, total: p.total, count: p.count, avg: Math.round(p.total / p.count), share: total > 0 ? p.total / total : 0 })),
    total, unnamed, unnamedCount, placeCount: list.length
  };
}

// ---- monthly recap ----
function monthRecap(transactions, budgets, y, m, now){
  now = now || new Date();
  transactions = transactions || [];
  const nowY = now.getFullYear(), nowM = now.getMonth() + 1;
  const isCurrent = (y === nowY && m === nowM);
  const isFuture = (y > nowY) || (y === nowY && m > nowM);
  const start = monthStartISO(y, m), end = monthEndISO(y, m);
  const pm = prevMonthOf(y, m);
  const prevStart = monthStartISO(pm.y, pm.m);
  const prevEnd = isoDate(pm.y, pm.m, isCurrent ? Math.min(now.getDate(), daysInMonthOf(pm.y, pm.m)) : daysInMonthOf(pm.y, pm.m));
  const compareEnd = isCurrent ? todayISO(now) : end;
  const num = (t)=> Number(t.amount) || 0;
  const within = (t, a, b)=> !!t.date && t.date >= a && t.date <= b;
  const sum = (arr)=> arr.reduce((s, t)=> s + num(t), 0);
  const byCat = (arr)=>{ const o = {}; arr.forEach(t=>{ o[t.category] = (o[t.category] || 0) + num(t); }); return o; };

  const exp = transactions.filter(t=>t.type === 'expense' && within(t, start, end));
  const inc = transactions.filter(t=>t.type === 'income' && within(t, start, end));
  const total = sum(exp);
  const elapsed = isFuture ? 0 : (isCurrent ? now.getDate() : daysInMonthOf(y, m));
  const catTotals = byCat(exp);
  const categories = Object.keys(catTotals).map(id=>({ id, total: catTotals[id], share: total > 0 ? catTotals[id] / total : 0 })).sort((a, b)=> b.total - a.total);

  // like-for-like with the previous month: a month still running is compared with the same days
  const curCmp = exp.filter(t=>t.date <= compareEnd);
  const prevCmp = transactions.filter(t=>t.type === 'expense' && within(t, prevStart, prevEnd));
  const curCmpTotal = sum(curCmp), prevCmpTotal = sum(prevCmp);
  const cc = byCat(curCmp), pc = byCat(prevCmp);
  let biggestChange = null;
  if(prevCmp.length){
    Object.keys(Object.assign({}, cc, pc)).forEach(id=>{
      const delta = (cc[id] || 0) - (pc[id] || 0);
      if(delta !== 0 && (!biggestChange || Math.abs(delta) > Math.abs(biggestChange.delta))) biggestChange = { id, delta, cur: cc[id] || 0, prev: pc[id] || 0 };
    });
  }
  let biggest = null;
  exp.forEach(t=>{
    if(!biggest || num(t) > biggest.amount || (num(t) === biggest.amount && t.date > biggest.date)){
      biggest = { id: t.id, note: t.note || '', category: t.category, amount: num(t), date: t.date, person: t.person };
    }
  });
  const tooEarly = isCurrent && now.getDate() < 3;
  return {
    y, m, isCurrent, isFuture, start, end, total,
    entries: exp.length,
    dailyAvg: elapsed > 0 ? Math.round(total / elapsed) : 0,
    byPerson: { p1: sum(exp.filter(t=>t.person === 'p1')), p2: sum(exp.filter(t=>t.person === 'p2')) },
    income: sum(inc), incomeCount: inc.length,
    biggest, categories, topCategory: categories[0] || null, biggestChange,
    compare: { cur: curCmpTotal, prev: prevCmpTotal, prevY: pm.y, prevM: pm.m, sameDays: isCurrent, change: tooEarly ? null : describeChange(pctChange(curCmpTotal, prevCmpTotal)) },
    places: topPlaces(exp, start, end, 3).places,
    budgets: (budgets || []).map(b=>{
      const spent = catTotals[b.category] || 0, limit = Number(b.limit) || 0;
      return { id: b.id, category: b.category, limit, spent, over: Math.max(0, spent - limit), pct: limit > 0 ? spent / limit : 0, status: spent > limit ? 'over' : 'within' };
    }),
    hasData: exp.length > 0 || inc.length > 0
  };
}

// ---- reminders & labels ----
function shouldShowBackupReminder(lastBackupAt, snoozeUntilMs, now){
  const nowMs = (now || new Date()).getTime();
  if(snoozeUntilMs && nowMs < snoozeUntilMs) return false;
  if(!lastBackupAt || isNaN(lastBackupAt.getTime())) return true;
  return nowMs - lastBackupAt.getTime() >= 30 * 86400000;
}
function timeAgo(ms, nowMs){
  if(!ms) return 'not yet';
  const s = Math.floor(Math.max(0, (nowMs || Date.now()) - ms) / 1000);
  if(s < 10) return 'just now';
  if(s < 60) return s + ' seconds ago';
  const mins = Math.floor(s / 60);
  if(mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.floor(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

const CAT_COLORS = {
  groceries: '#5FC7FF', dining: '#FF9F0A', transport: '#6C7BFF', bills: '#FFD60A', housing: '#30D5C8',
  shopping: '#E879F9', health: '#FF5E5E', entertainment: '#8B5CF6', education: '#84CC16', kids: '#BF5AF2',

  salary: '#30D158', bonus: '#A3E635', investment: '#30D158', gift: '#FF6B8B', refund: '#30D5C8', other_income: '#8E8E93'

const CAT_FALLBACK = ['#5FC7FF', '#FF9F0A', '#6C7BFF', '#FFD60A', '#30D5C8', '#E879F9', '#FF5E5E', '#8B5CF6', '#84CC16', '#BF5AF2', '#FF6B8B', '#64D2FF'];
// Known categories keep their colour; categories you add yourself get a steady colour from a palette.
function catColor(type, id){
  if(CAT_COLORS[id]) return CAT_COLORS[id];
  const key = String(type) + ':' + String(id);
  let h = 5381;
  for(let i = 0; i < key.length; i++) h = ((h << 5) + h + key.charCodeAt(i)) >>> 0;
  return CAT_FALLBACK[h % CAT_FALLBACK.length];
}

// ---- dates that mean the same thing in every time zone ----
// (a plain "2026-09-10" is a calendar day, not a moment in time)
function dateLabelLocal(iso, now){
  now = now || new Date();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return String(iso || '');
  const t = todayISO(now);
  if(iso === t) return 'Today';
  if(iso === addDaysISO(t, -1)) return 'Yesterday';
  const d = parseISODate(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}
function shortDateLabel(iso, now){
  now = now || new Date();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return 'Date';
  const t = todayISO(now);

}

// ---- the number pad ----
function keypadPress(digits, key, maxLen){
  digits = String(digits || ''); maxLen = maxLen || 12;
  if(key === 'back') return digits.slice(0, -1);
  if(key === '000') return (!digits || digits.length + 3 > maxLen) ? digits : digits + '000';   // "000" on an empty amount does nothing
  if(!/^[0-9]$/.test(String(key))) return digits;
  if(!digits && key === '0') return digits;                                                      // no leading zeros
  if(digits.length >= maxLen) return digits;
  return digits + key;
}

}

// ---- the order of the category tiles: the ones you use most come first (ties keep your own order) ----
function categoriesByUsage(transactions, type, catList){
  const counts = {};
  (transactions || []).forEach(t=>{ if(t && t.type === type) counts[t.category] = (counts[t.category] || 0) + 1; });
  return (catList || []).map((c, i)=>({ c, i, n: counts[c.id] || 0 })).sort((a, b)=> b.n - a.n || a.i - b.i).map(x=>x.c);
}

// ---- grouping the activity list by day ----
// list: rows in display order. totalsSource (optional): all entries, so a day's total is the real total even when only part of the day is shown.
function dayGroups(list, totalsSource){
  const groups = [], byDate = new Map();
  (list || []).forEach(t=>{
    let g = byDate.get(t.date);
    if(!g){ g = { date: t.date, rows: [], spent: 0, income: 0 }; byDate.set(t.date, g); groups.push(g); }
    g.rows.push(t);
  });
  const totals = {};
  (totalsSource || list || []).forEach(t=>{
    const o = totals[t.date] || (totals[t.date] = { spent: 0, income: 0 });
    const a = Number(t.amount) || 0;
    if(t.type === 'income') o.income += a; else o.spent += a;
  });
  groups.forEach(g=>{ const o = totals[g.date]; if(o){ g.spent = o.spent; g.income = o.income; } });
  return groups;
}

// ---- food: remembering what you buy ----
const EXPIRY_PRESETS = [{ label: '3 days', days: 3 }, { label: '1 week', days: 7 }, { label: '2 weeks', days: 14 }, { label: '1 month', days: 30 }, { label: '3 months', days: 90 }];
// Things you have bought before (same name = same thing), most bought first, with how long they usually last.
function foodSuggestions(foodItems, query, limit){
  const q = String(query || '').trim().toLowerCase();
  const stats = new Map();
  (foodItems || []).forEach(f=>{
    const name = String((f && f.name) || '').trim();
    if(!name) return;
    const key = name.toLowerCase();
    let st = stats.get(key);
    if(!st){ st = { name, count: 0, amount: '', last: -1 }; stats.set(key, st); }
    st.count++;
    const when = Number(f.createdAt) || 0;
    if(when >= st.last){ st.last = when; st.name = name; st.amount = typeof f.amount === 'string' ? f.amount : ''; }
  });
  let list = Array.from(stats.values());
  if(q) list = list.filter(x=>x.name.toLowerCase().includes(q));
  list.sort((a, b)=>{
    if(q){ const as = a.name.toLowerCase().startsWith(q) ? 1 : 0, bs = b.name.toLowerCase().startsWith(q) ? 1 : 0; if(as !== bs) return bs - as; }
    if(b.count !== a.count) return b.count - a.count;
    if(b.last !== a.last) return b.last - a.last;
    return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
  });
  return list.slice(0, limit || 6).map(x=>({ name: x.name, amount: x.amount, count: x.count, days: suggestShelfLifeDays(x.name, foodItems) }));
}
function daysUntilISO(iso, now){ return Math.round((parseISODate(iso) - parseISODate(todayISO(now))) / 86400000); }
function describeExpiry(iso, now){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return { text: '', tone: '', days: null };
  const d = daysUntilISO(iso, now);
  if(d < 0) return { text: d === -1 ? 'That was yesterday' : 'That date has already passed', tone: 'bad', days: d };
  if(d === 0) return { text: 'Expires today', tone: 'warn', days: d };
  if(d === 1) return { text: 'Expires tomorrow', tone: 'warn', days: d };
  if(d <= 3) return { text: 'Expires in ' + d + ' days', tone: 'warn', days: d };
  if(d <= 60) return { text: 'Expires in ' + d + ' days', tone: '', days: d };
  return { text: 'Expires in about ' + Math.round(d / 30) + ' months', tone: '', days: d };
}
function expiryLongLabel(iso, now){
  now = now || new Date();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return '';
  const d = parseISODate(iso);
  const wd = d.toLocaleDateString('en-GB', { weekday: 'short' }), dm = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return wd + ' ' + dm + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : '');
}

let updateAvailable = false, updateDismissed = false, lastVersionCheck = 0;
function reloadPage(){ location.reload(); }
function showUpdateBanner(){
  const el = document.getElementById('updateBanner');
  if(!el || updateDismissed) return;
  el.innerHTML = `<span class="ub-text">A new version is available.</span><span class="ub-action">Update</span><button class="ub-close" id="updateClose" aria-label="Dismiss">✕</button>`;

}
async function checkForUpdate(force){
  if(updateAvailable) return;
  if(!force && Date.now() - lastVersionCheck < 10 * 60 * 1000) return;
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return;
  lastVersionCheck = Date.now();
  try{
    const res = await fetch(location.pathname + '?vcheck=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return;
    if(isNewerVersion(parseRemoteVersion(await res.text()), APP_VERSION)){ updateAvailable = true; showUpdateBanner(); }
  }catch(e){ /* offline or blocked — try again later */ }
}
async function applyUpdate(){
  const el = document.getElementById('updateBanner');
  const backOff = (msg)=>{
    if(!el) return;
    el.innerHTML = `<span class="ub-text">${esc(msg)}</span><span class="ub-action">Retry</span>`;
    el.onclick = ()=> applyUpdate();
  };
  // Never clear the saved copy of the app unless we are sure we can load the new one.
  if(typeof navigator !== 'undefined' && navigator.onLine === false){ backOff("You're offline. Connect to the internet, then tap here to update."); return; }
  if(el){ el.onclick = null; el.innerHTML = '<span class="ub-text">Updating…</span>'; }
  try{
    const probe = await fetch(location.pathname + '?vcheck=' + Date.now(), { cache: 'no-store' });
    if(!probe.ok) throw new Error('unreachable');
  }catch(e){ backOff("Couldn't reach the server. Tap here to try again."); return; }
  // let any unsaved change reach the server first
  try{ flushIfDirty(); }catch(e){}
  const t0 = Date.now();
  while(Date.now() - t0 < 6000 && (saveInFlight || (lastSyncedState && !sameContent(state, lastSyncedState)))){
    await new Promise(r=>setTimeout(r, 200));
  }
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){ const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
  }catch(e){ /* reload anyway */ }
  reloadPage();
}

let pillTextUntil = 0, pillPrevState = '', pillTimer = null, syncSheetWrap = null;
const SYNC_ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  spinner: '<svg class="sync-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  offline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2.4-1.9"/><path d="M12 20h.01"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>'
};
function syncDisplay(s){
  const n = s.pending;
  const plural = (k)=> k + (k === 1 ? ' change' : ' changes');
  if(s.state === 'saving') return { cls: 'saving', icon: SYNC_ICONS.spinner, text: 'Saving…', head: 'Saving…', label: 'Saving your changes' };
  if(s.state === 'error') return { cls: 'error', icon: SYNC_ICONS.alert, text: 'Not saved', head: "Couldn't save " + plural(n) + '. Retrying…', label: "Couldn't save " + plural(n) };
  if(s.state === 'offline') return { cls: 'offline', icon: SYNC_ICONS.offline, text: 'Offline · ' + n, head: "You're offline. " + plural(n) + " will sync when you're back online.", label: 'Offline, ' + plural(n) + ' waiting' };
  if(s.state === 'waiting') return { cls: 'waiting', icon: SYNC_ICONS.clock, text: n + ' waiting', head: plural(n) + ' waiting to sync', label: plural(n) + ' waiting to sync' };
  if(s.offline) return { cls: 'offline', icon: SYNC_ICONS.offline, text: 'Offline', head: "You're offline. Everything so far is saved.", label: 'Offline, everything so far is saved' };
  return { cls: 'saved', icon: SYNC_ICONS.check, text: 'Saved', head: 'All changes saved', label: 'All changes saved' };
}
function updateSyncPill(){
  const pill = document.getElementById('syncPill');
  if(!pill) return;
  if(!FIREBASE_CONFIGURED){ pill.style.display = 'none'; return; }
  const s = getSyncStatus();
  if(s.state === 'connecting'){ pill.style.display = 'none'; pillPrevState = ''; syncSheetRefresh(); return; }
  if(s.state === 'saved' && !s.offline && pillPrevState && pillPrevState !== 'saved'){
    pillTextUntil = Date.now() + 2500;           // say "Saved" for a moment, then settle to a quiet tick
    clearTimeout(pillTimer);
    pillTimer = setTimeout(updateSyncPill, 2600);
  }
  pillPrevState = s.state;
  const d = syncDisplay(s);
  const showText = d.cls !== 'saved' || Date.now() < pillTextUntil;
  pill.className = 'sync-pill ' + d.cls + (showText ? '' : ' icon-only');
  pill.innerHTML = d.icon + (showText ? '<span>' + esc(d.text) + '</span>' : '');
  pill.setAttribute('aria-label', d.label);
  pill.style.display = '';
  syncSheetRefresh();
}
function onSyncStatus(){ updateSyncPill(); }

function syncSheetBodyHtml(){
  const s = getSyncStatus(), d = syncDisplay(s), bs = backupStatus();
  const row = (k, v, cls)=>`<div class="info-row"><span>${k}</span><span class="${cls || ''}">${v}</span></div>`;
  return `
    <div class="sync-head ${d.cls}"><div class="sync-head-icon">${d.icon}</div><div class="sync-head-text">${esc(d.head)}</div></div>
    <div class="menu-group">
      ${row('Last saved', esc(timeAgo(s.lastSyncedAt)))}
      ${row('Waiting to sync', s.pending ? String(s.pending) : 'Nothing')}
      ${row('Connection', s.offline ? 'Offline' : 'Online', s.offline ? 'warn' : '')}
      ${row('Last backup', esc(bs.text), bs.stale ? 'warn' : '')}
      ${row('App version', esc(APP_VERSION))}
      ${row('Display', esc(displayInfo()), 'small')}
    </div>`;
}
function syncSheetRefresh(){
  if(!syncSheetWrap) return;
  if(!document.body.contains(syncSheetWrap)){ syncSheetWrap = null; return; }
  const body = syncSheetWrap.querySelector('#syncSheetBody');
  if(body) body.innerHTML = syncSheetBodyHtml();
}
function openSyncStatusSheet(){
  const html = `
    <div class="sheet-title">Sync status</div>
    <div id="syncSheetBody">${syncSheetBodyHtml()}</div>
    <button class="btn-primary" id="syncNowBtn">Sync now</button>
    <button class="btn-secondary" id="syncBackupBtn">Back up…</button>
    <div class="hint">Changes are saved to the cloud so both phones stay in step. If you're offline they wait on this phone and sync by themselves.</div>
  `;
  showSheet(html, (w)=>{
    syncSheetWrap = w;
    w.querySelector('#syncNowBtn').onclick = async ()=>{
      const b = w.querySelector('#syncNowBtn');
      b.disabled = true; b.textContent = 'Syncing…';
      flushIfDirty();
      await refreshFromServer();
      b.disabled = false; b.textContent = 'Sync now';
      syncSheetRefresh();
    };
    w.querySelector('#syncBackupBtn').onclick = ()=>{ closeSheet(w); openBackupSheet(); };
  });
}
(function(){ const p = document.getElementById('syncPill'); if(p) p.onclick = openSyncStatusSheet; })();

// ---------- DISPLAY INFO (shown in the Sync status sheet, so layout problems can be read off a screenshot) ----------
function displayInfo(){
  let standalone = false, lvh = '?', page = '?';
  try{ standalone = window.navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }catch(e){}
  try{
    const p = document.createElement('div');
    p.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:100lvh;visibility:hidden;pointer-events:none';
    document.body.appendChild(p); lvh = p.offsetHeight; p.remove();
    page = document.documentElement.clientHeight;
  }catch(e){}
  return window.innerWidth + '×' + window.innerHeight + ' of ' + screen.width + '×' + screen.height + (standalone ? ' · app' : ' · browser') + ' · page ' + page + ' · lvh ' + lvh;
}

function fmt(n){
  const v = Math.round(Number(n)||0);
  return state.settings.currency + ' ' + v.toLocaleString(CURRENCY_LOCALE);
}

function allCats(type){ return type === 'income' ? state.categories.income : state.categories.expense; }
function catInfo(type, id){
  return allCats(type).find(c=>c.id===id) || {label:'Other', icon:'📦'};
}
function personName(key){ return key === 'p2' ? state.settings.person2 : state.settings.person1; }
function personInitial(key){ return personName(key).trim().charAt(0).toUpperCase() || '?'; }

function totalBalance(){ return state.accounts.reduce((s,a)=>s + Number(a.balance||0), 0); }

function isThisMonth(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function getRangeBounds(filter){
  const now = new Date();
  let start, end;
  if(filter.range === 'last_month'){
    start = new Date(now.getFullYear(), now.getMonth()-1, 1);
    end = new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59);
  } else if(filter.range === 'this_year'){
    start = new Date(now.getFullYear(), 0, 1);
    end = new Date(now.getFullYear(), 11, 31, 23,59,59);
  } else if(filter.range === 'custom'){
    start = filter.customStart ? new Date(filter.customStart+'T00:00:00') : new Date(0);
    end = filter.customEnd ? new Date(filter.customEnd+'T23:59:59') : now;
  } else {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59);
  }
  return { start, end };
}

function inFilterRange(dateStr, filter){
  const { start, end } = getRangeBounds(filter);
  const d = new Date(dateStr+'T12:00:00');
  return d >= start && d <= end;
}

function shortDate(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function filterLabel(filter){
  if(filter.range === 'last_month') return "Last month's expenses";
  if(filter.range === 'this_year') return "This year's expenses";
  if(filter.range === 'custom'){
    if(filter.customStart && filter.customEnd) return 'Expenses: ' + shortDate(filter.customStart) + ' – ' + shortDate(filter.customEnd);
    return 'Expenses: custom range';
  }
  return "This month's expenses";
}

function filteredSpend(){
  const out = { p1:0, p2:0, all:0 };
  const filter = ui.spendFilter;
  state.transactions.forEach(t=>{
    if(t.type!=='expense') return;
    if(!inFilterRange(t.date, filter)) return;
    if(filter.categories.length && !filter.categories.includes(t.category)) return;
    out[t.person] = (out[t.person]||0) + Number(t.amount);
    out.all += Number(t.amount);
  });
  return out;
}

// ---------- TREND CHART ----------
function getTrendMonths(){
  const now = new Date();
  const months = [];
  for(let i=2; i>=0; i--){
    months.push(new Date(now.getFullYear(), now.getMonth() - ui.trendOffset - i, 1));
  }
  return months;
}

function trendPeriodLabel(months){
  const first = months[0], last = months[2];
  const firstLabel = first.toLocaleDateString('en-GB', { month:'short', year:'numeric' });
  const lastLabel = last.toLocaleDateString('en-GB', { month:'short', year:'numeric' });
  return `${firstLabel} – ${lastLabel}`;
}

function trendDataForMonth(monthDate){
  const y = monthDate.getFullYear(), m = monthDate.getMonth();
  let all = 0, p1 = 0, p2 = 0;
  state.transactions.forEach(t=>{
    if(t.type !== 'expense') return;
    const d = new Date(t.date+'T12:00:00');
    if(d.getFullYear()===y && d.getMonth()===m){
      const amt = Number(t.amount);
      all += amt;
      if(t.person==='p1') p1 += amt;
      else if(t.person==='p2') p2 += amt;
    }
  });
  return { all, p1, p2 };
}

function renderTrendChart(months){
  const data = months.map(trendDataForMonth);
  const maxVal = Math.max(1, ...data.flatMap(d=>[d.all, d.p1, d.p2]));
  const maxBarPx = 120;

  const barsHtml = months.map((m, i)=>{
    const d = data[i];
    const key = `${m.getFullYear()}-${m.getMonth()}`;
    const hAll = Math.max(2, Math.round((d.all/maxVal)*maxBarPx));
    const hP1 = Math.max(2, Math.round((d.p1/maxVal)*maxBarPx));
    const hP2 = Math.max(2, Math.round((d.p2/maxVal)*maxBarPx));
    return `<div class="month-group">
      <div class="bar all" data-trendbar="all" data-trendmonth="${key}" style="height:${hAll}px;"><span class="val">${fmt(d.all)}</span></div>
      <div class="bar p1" data-trendbar="p1" data-trendmonth="${key}" style="height:${hP1}px;"></div>
      <div class="bar p2" data-trendbar="p2" data-trendmonth="${key}" style="height:${hP2}px;"></div>
    </div>`;
  }).join('');

  const labelsHtml = months.map(m=>`<div class="month-label">${esc(m.toLocaleDateString('en-GB',{month:'short'}))}</div>`).join('');

  return `<div class="chart-card">
    <div class="chart-row">${barsHtml}</div>
    <div class="month-labels">${labelsHtml}</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--blue);"></div>All</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(94,140,58,0.9);"></div>${esc(state.settings.person1)}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red);"></div>${esc(state.settings.person2)}</div>
    </div>
  </div>`;
}

function jumpToMonthFilter(year, month, person){

// ---------- CATEGORY PIE CHART ----------
const PIE_COLORS = ['#CCF180', '#5FC7FF', '#FF9F0A', '#BF5AF2', '#FF6B6B', '#8E8E93'];

function categoryBreakdown(){
  const filter = ui.spendFilter;
  const totals = {};
  state.transactions.forEach(t=>{
    if(t.type !== 'expense') return;
    if(!inFilterRange(t.date, filter)) return;
    totals[t.category] = (totals[t.category] || 0) + Number(t.amount);
  });
  const entries = Object.entries(totals).map(([catId, amt])=>({ catId, amt, info: catInfo('expense', catId) }));
  entries.sort((a, b)=> b.amt - a.amt);
  const total = entries.reduce((s, e)=> s + e.amt, 0);
  const top = entries.slice(0, 5);
  const rest = entries.slice(5);
  const restTotal = rest.reduce((s, e)=> s + e.amt, 0);
  const slices = top.map(e=>({ label: e.info.label, icon: e.info.icon, amt: e.amt, catId: e.catId }));
  if(rest.length > 0){
    slices.push({ label: `Others (${rest.length})`, icon: '', amt: restTotal, catId: null, isOthers: true });
  }
  return { slices, total };
}

function renderCategoryPie(){
  const { slices, total } = categoryBreakdown();
  if(slices.length === 0 || total <= 0){
    return `<div class="empty-state">No expenses in this period yet.</div>`;
  }
  let cum = 0;
  const gradientParts = slices.map((s, i)=>{
    const pct = (s.amt / total) * 100;
    const start = cum;
    const end = cum + pct;
    cum = end;
    return `${PIE_COLORS[i % PIE_COLORS.length]} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
  }).join(', ');

  const legendHtml = slices.map((s, i)=>{
    const pct = Math.round((s.amt / total) * 100);
    const label = s.isOthers ? esc(s.label) : `${s.icon} ${esc(s.label)}`;
    return `<div class="legend-row" data-catslice="${s.isOthers ? '' : s.catId}">
      <div class="legend-dot" style="background:${PIE_COLORS[i % PIE_COLORS.length]};"></div>
      <div class="legend-name">${label}</div>
      <div class="legend-pct">${pct}%</div>
      <div class="legend-amt">${fmt(s.amt)}</div>
    </div>`;
  }).join('');

  return `<div class="pie-card">
    <div class="pie-wrap">
      <div class="pie" style="background: conic-gradient(${gradientParts});">
        <div class="pie-total"><div class="amt">${fmt(total)}</div><div class="lbl">Total</div></div>
      </div>
    </div>
    <div class="legend-list">${legendHtml}</div>
  </div>`;
}

function budgetSpent(categoryId){

function dateLabel(dateStr){ return dateLabelLocal(dateStr); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- SWIPE ON A ROW (Add again / Delete) ----------
const SWIPE_OPEN = 148;
let swipe = null;          // the drag in progress
let openSwipeRow = null;   // the row that is currently swiped open
function swipeSetX(w, x, animate){
  const row = w.querySelector('.tx-row');
  row.classList.toggle('drag', !animate);
  row.style.transform = 'translateX(' + x + 'px)';
  if(x < -1) w.classList.add('reveal');
}
function openSwipe(w){
  if(openSwipeRow && openSwipeRow !== w) closeSwipe(openSwipeRow);
  swipeSetX(w, -SWIPE_OPEN, true); w.dataset.open = '1'; openSwipeRow = w;
}
function closeSwipe(w){
  swipeSetX(w, 0, true); w.dataset.open = '';
  if(openSwipeRow === w) openSwipeRow = null;
  setTimeout(()=>{ if(!w.dataset.open) w.classList.remove('reveal'); }, 260);
}
function swipeEnd(){
  if(!swipe) return;
  const s = swipe; swipe = null;
  if(!s.horiz || !s.moved) return;
  s.w._dragEnd = performance.now();                // a mouse fires a "click" right after a drag: remember it was a drag
  (s.x < -SWIPE_OPEN * 0.45) ? openSwipe(s.w) : closeSwipe(s.w);
}
window.addEventListener('pointermove', (e)=>{
  if(!swipe) return;
  const dx = e.clientX - swipe.sx, dy = e.clientY - swipe.sy;
  if(!swipe.decided){
    if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    swipe.decided = true; swipe.horiz = Math.abs(dx) > Math.abs(dy);
    if(!swipe.horiz){ swipe = null; return; }        // it is a scroll, leave it alone
    try{ swipe.w.querySelector('.tx-row').setPointerCapture(e.pointerId); }catch(err){}
  }
  swipe.moved = true;
  const x = Math.max(-SWIPE_OPEN - 28, Math.min(0, swipe.base + dx));
  swipeSetX(swipe.w, x < -SWIPE_OPEN ? -SWIPE_OPEN + (x + SWIPE_OPEN) * 0.35 : x, false);   // a little resistance past the buttons
  swipe.x = x;
});
window.addEventListener('pointerup', swipeEnd);
window.addEventListener('pointercancel', swipeEnd);

function bindTxRows(container){
  if(!container || container._txBound) return;
  container._txBound = true;
  container.addEventListener('pointerdown', (e)=>{
    if(e._swipeSeen) return; e._swipeSeen = true;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const w = e.target.closest && e.target.closest('.row-wrap');
    if(openSwipeRow && openSwipeRow !== w) closeSwipe(openSwipeRow);
    if(!w || e.target.closest('.act')) return;
    swipe = { w, sx: e.clientX, sy: e.clientY, base: w.dataset.open ? -SWIPE_OPEN : 0, decided: false, horiz: false, moved: false, x: 0 };
  });
  container.addEventListener('click', (e)=>{
    if(e._txSeen) return;
    const w = e.target.closest && e.target.closest('.row-wrap');
    if(!w) return;
    e._txSeen = true;
    const act = e.target.closest('.act');
    if(act){
      e.stopPropagation();
      if(act.getAttribute('data-act') === 'del') swipeDelete(w, w.getAttribute('data-tx'));
      else { closeSwipe(w); swipeAddAgain(w.getAttribute('data-tx')); }
      return;
    }
    if(w._dragEnd !== undefined && performance.now() - w._dragEnd < 400) return;  // the click that ends a drag is not a tap
    if(w.dataset.open){ closeSwipe(w); return; }
    openTxDetailSheet(w.getAttribute('data-tx'));
  });
}

function swipeDelete(w, txId){
  const h = w.offsetHeight;
  closeSwipe(w);
  w.style.height = h + 'px'; void w.offsetHeight; w.style.height = '0px'; w.classList.add('removed');   // fold the row away...
  setTimeout(()=> deleteTransactionWithUndo(txId), 240);                                              // ...then really delete it (with Undo)
}
function swipeAddAgain(txId){
  const t = state.transactions.find(x=>x.id === txId);
  if(!t) return;
  openAddTxSheet({ txType: t.type, person: t.person, accountId: t.accountId || null, prefill: { amount: t.amount, note: t.note, category: t.category, date: todayISO() } });
}

// Delete an entry (putting money back in its account) and offer Undo. Used by the entry screen and by swiping.
function deleteTransactionWithUndo(txId){
  const t = state.transactions.find(x=>x.id === txId);
  if(!t) return;
  const removed = t;
  const acc = state.accounts.find(a=>a.id === t.accountId);
  if(acc){ acc.balance = Number(acc.balance) - (t.type === 'income' ? Number(t.amount) : -Number(t.amount)); }
  state.transactions = state.transactions.filter(x=>x.id !== txId);
  saveState(); render();
  showUndoToast('Transaction deleted', ()=>{
    state.transactions.push(removed);
    const a = state.accounts.find(x=>x.id === removed.accountId);
    if(a){ a.balance = Number(a.balance) + (removed.type === 'income' ? Number(removed.amount) : -Number(removed.amount)); }
    saveState(); render();
  });
}

function sortedTransactions(){
  return [...state.transactions].sort((a,b)=> new Date(b.date) - new Date(a.date) || (b.createdAt||0)-(a.createdAt||0));
}

function historyRangeLabel(f){
  if(f.range === 'last_month') return 'Last month';
  if(f.range === 'this_year') return 'This year';
  if(f.range === 'this_month') return 'This month';
  if(f.range === 'custom'){
    if(f.customStart && f.customEnd) return shortDate(f.customStart) + ' – ' + shortDate(f.customEnd);
    return 'Custom range';
  }
  return 'All time';
}

function historyMatchesFilters(t){
  const f = ui.historyFilter;
  if(f.type && t.type !== f.type) return false;
  if(f.person && t.person !== f.person) return false;
  if(f.categories && f.categories.length && !f.categories.includes(t.category)) return false;
  if(f.query){
    const q = f.query.toLowerCase();
    const info = catInfo(t.type, t.category);
    const acc = state.accounts.find(a=>a.id===t.accountId);
    const haystack = [info.label, personName(t.person), acc ? acc.name : '', t.note || ''].join(' ').toLowerCase();
    if(!haystack.includes(q)) return false;
  }
  if(f.range && f.range !== 'all'){
    if(!inFilterRange(t.date, f)) return false;
  }
  return true;
}

function resetHistoryFilter(){
  ui.historyFilter.range = 'all';
  ui.historyFilter.customStart = null;
  ui.historyFilter.customEnd = null;
  ui.historyFilter.person = null;
  ui.historyFilter.type = null;
  ui.historyFilter.categories = [];
}

function openHistoryWithFilter(overrides){
  resetHistoryFilter();
  ui.historyFilter.query = '';
  Object.assign(ui.historyFilter, overrides || {});
  goToView('history');
}

function activeQuickFilterSummary(){
  const f = ui.historyFilter;
  const parts = [];
  if(f.range !== 'all') parts.push(historyRangeLabel(f));
  if(f.person) parts.push(personName(f.person));
  if(f.type) parts.push(f.type === 'expense' ? 'Expenses' : 'Income');
  if(f.categories && f.categories.length) parts.push(f.categories.length + (f.categories.length===1?' category':' categories'));
  return parts.join(' · ');
}

function updateHistoryList(){
  const wrap = document.getElementById('historyListWrap');
  if(!wrap) return;
  const filtered = sortedTransactions().filter(historyMatchesFilters);
  wrap.innerHTML = filtered.length === 0

    : renderTxList(filtered);
  bindTxRows(wrap);

        ${RANGE_OPTIONS.map(r=>`<div class="account-pick-item ${r.id===range?'active':''}" data-range="${r.id}"><span class="n">${r.label}</span></div>`).join('')}
      </div>

  // Budgets
  html += `<div class="section">

  if(state.budgets.length === 0){

  } else {

function goToView(view){
  const pageInner = document.getElementById('pageInner');
  const scrollArea = document.getElementById('scroll-area');
  const goingForward = view === 'history';
  const outClass = goingForward ? 'slide-out-left' : 'slide-out-right';
  const inClass = goingForward ? 'slide-in-right' : 'slide-in-left';

  if(!pageInner){
    ui.view = view;
    render();
    return;
  }

  pageInner.classList.add(outClass);
  setTimeout(()=>{
    ui.view = view;
    render();
    if(scrollArea) scrollArea.scrollTop = 0;
    const freshInner = document.getElementById('pageInner');
    if(freshInner){
      freshInner.classList.remove('slide-out-left', 'slide-out-right');
      freshInner.classList.add(inClass);
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          freshInner.classList.remove(inClass);
        });
      });
    }
  }, 160);
}

// ---------- FOOD TAB ----------
function sortedFoodItems(){
  return [...state.foodItems].sort((a,b)=> new Date(a.expiryDate) - new Date(b.expiryDate));
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d - today) / (1000*60*60*24));
}

function expiryLabel(dateStr){
  const days = daysUntil(dateStr);
  if(days < 0) return { text: `Expired ${Math.abs(days)}d ago`, tone: 'red' };
  if(days === 0) return { text: 'Expires today', tone: 'red' };
  if(days === 1) return { text: 'Expires tomorrow', tone: 'orange' };
  if(days <= 3) return { text: `Expires in ${days}d`, tone: 'orange' };
  return { text: `Expires in ${days}d`, tone: 'normal' };
}

function checkedSVG(){
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
}

function attachFoodListeners(){
  document.querySelectorAll('[data-foodfilter]').forEach(btn=>{
    btn.onclick = ()=>{ ui.foodFilter = btn.getAttribute('data-foodfilter'); render(); };
  });
  document.querySelectorAll('[data-foodcheck]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-foodcheck');
      const item = state.foodItems.find(f=>f.id===id);
      if(item){ item.used = !item.used; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-rebuy]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const item = state.foodItems.find(f=>f.id === btn.getAttribute('data-rebuy'));
      if(item) openFoodFormSheet(null, rebuyPrefill(item));

    row.onclick = ()=> openEditFoodSheet(row.getAttribute('data-food'));

function openFoodFormSheet(existing, prefill){
  prefill = prefill || {};
  const src = existing || prefill;
  let nameVal = src.name || '';
  let expiry = existing ? (existing.expiryDate || '') : (prefill.expiryDate || '');
  let suggestedDays = existing ? null : (prefill.suggestedDays || (nameVal ? suggestShelfLifeDays(nameVal, state.foodItems) : null));
  let sugsHidden = false, nameFocused = false;
  const title = existing ? 'Edit food item' : (prefill.rebuy ? 'Buy again' : 'Add food item');
  const caption = existing ? 'Edit food item' : (prefill.rebuy ? 'Buy again' : 'New food item');

  function chipsHtml(){
    const t = todayISO(), list = [];
    if(suggestedDays) list.push({ days: suggestedDays, label: 'Like last time · ' + suggestedDays + (suggestedDays === 1 ? ' day' : ' days'), hint: true });
    EXPIRY_PRESETS.forEach(p=>{ if(p.days !== suggestedDays) list.push({ days: p.days, label: p.label, hint: false }); });
    return list.map(c=>`<button type="button" class="opt-chip${c.hint ? ' hint' : ''}${expiry && expiry === addDaysISO(t, c.days) ? ' active' : ''}" data-days="${c.days}">${esc(c.label)}</button>`).join('');
  }
  function expiryLine(){
    if(!expiry) return { text: 'Choose how long it will last', tone: '' };
    const d = describeExpiry(expiry);
    return { text: d.text + ' · ' + expiryLongLabel(expiry), tone: d.tone };
  }
  function bodyHtml(){

      }
      saveState(); render(); closeSheet(wrap);
    };
    if(existing){
      wrap.querySelector('#foodDelete').onclick = ()=>{

        state.foodItems = state.foodItems.filter(f=>f.id !== existing.id);
        saveState(); render(); closeSheet(wrap);
        showUndoToast('Food item deleted', ()=>{
          state.foodItems.splice(Math.min(idx, state.foodItems.length), 0, removed);
          saveState(); render();
        });
      };
    }
  }, 'sheet-add');
}

async function doRefresh(){
  await refreshFromServer();
  await new Promise((resolve)=> setTimeout(resolve, 350));
}

(function(){
  const scrollAreaEl = document.getElementById('scroll-area');
  const indicator = document.getElementById('pullIndicator');
  const THRESHOLD = 64;
  let startY = 0, pulling = false, currentPull = 0, refreshing = false;

  scrollAreaEl.addEventListener('touchstart', (e)=>{
    if(refreshing) return;
    if(scrollAreaEl.scrollTop <= 0){
      startY = e.touches[0].clientY;
      pulling = true;
    } else {
      pulling = false;
    }
  }, { passive: true });

  scrollAreaEl.addEventListener('touchmove', (e)=>{
    if(!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if(dy > 0 && scrollAreaEl.scrollTop <= 0){
      currentPull = Math.min(dy * 0.5, 90);
      indicator.style.transition = 'none';
      indicator.style.transform = `translateY(${currentPull}px)`;
      indicator.style.opacity = String(Math.min(currentPull / THRESHOLD, 1));
      if(currentPull > 10 && e.cancelable) e.preventDefault();
    }
  }, { passive: false });

  scrollAreaEl.addEventListener('touchend', ()=>{
    if(!pulling || refreshing) return;
    pulling = false;
    indicator.style.transition = '';
    if(currentPull >= THRESHOLD){
      refreshing = true;
      indicator.style.transform = 'translateY(46px)';
      indicator.style.opacity = '1';
      doRefresh().finally(()=>{
        indicator.style.transform = 'translateY(-6px)';
        indicator.style.opacity = '0';
        refreshing = false;
      });
    } else {
      indicator.style.transform = 'translateY(-6px)';
      indicator.style.opacity = '0';
    }
    currentPull = 0;
  });
})();
