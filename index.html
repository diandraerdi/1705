// "How often?" - a small picker, so the main form stays simple
function openRepeatPickerSheet(cur, onPick){
  let repeat = cur.repeat === 'days' ? 'days' : 'monthly', day = String(cur.day || 1), every = String(cur.every || 7);
  function bodyHtml(){
    return `
      <div class="segmented" id="rpSeg" style="margin-top:0">
        <button type="button" data-val="monthly" class="${repeat === 'monthly' ? 'active' : ''}">Every month</button>
        <button type="button" data-val="days" class="${repeat === 'days' ? 'active' : ''}">Every few days</button>
      </div>
      ${repeat === 'monthly'
        ? `<label class="field-label">Day of the month</label><input type="number" id="rpDay" min="1" max="31" inputmode="numeric" value="${esc(day)}"><div class="hint">In shorter months it's due on the last day.</div>`
        : `<label class="field-label">Every how many days?</label><input type="number" id="rpEvery" min="1" max="365" inputmode="numeric" value="${esc(every)}">`}
      <div class="field-error" id="rpErr"></div>
      <button class="btn-primary" id="rpDone">Done</button>`;
  }
  showSheet(`<div class="sheet-title">Repeats</div><div id="rpBody">${bodyHtml()}</div>`, (w)=>{
    function capture(){ const d = w.querySelector('#rpDay'), e = w.querySelector('#rpEvery'); if(d) day = d.value; if(e) every = e.value; }
    function bind(){
      w.querySelectorAll('#rpSeg button').forEach(b=>{ b.onclick = ()=>{ capture(); repeat = b.getAttribute('data-val'); w.querySelector('#rpBody').innerHTML = bodyHtml(); bind(); }; });
      w.querySelector('#rpDone').onclick = ()=>{
        capture();
        const d = parseInt(day, 10), e = parseInt(every, 10), err = (m)=>{ w.querySelector('#rpErr').textContent = m; };
        if(repeat === 'monthly' && !(d >= 1 && d <= 31)) return err('Enter a day between 1 and 31.');
        if(repeat === 'days' && !(e >= 1 && e <= 365)) return err('Enter a number of days between 1 and 365.');
        onPick({ repeat, day: (d >= 1 && d <= 31) ? d : 1, every: (e >= 1) ? e : 1 });
        closeSheet(w);
      };
    }
    bind();
  });
}

function openRecurringFormSheet(existing, seed, backFn){
  const base = existing || seed || {};
  const hasBase = !!(existing || seed);
  const validAcc = (id)=> !!(id && state.accounts.find(a=>a.id === id));
  let type = base.type || 'expense';
  let category = base.category || mostUsedCategory(state.transactions, type, allCats(type)) || allCats(type)[0].id;
  let person = base.person || getDefaultPerson();
  let accountId = validAcc(base.accountId) ? base.accountId : (state.accounts.length ? state.accounts[0].id : null);
  let skipAccount = hasBase ? !validAcc(base.accountId) : (type === 'expense' ? true : state.accounts.length === 0);
  let repeat = base.repeat || 'monthly';
  let day = Number(base.day) || (base.nextDue ? Number(String(base.nextDue).slice(8, 10)) : new Date().getDate());
  let every = Number(base.every) || 7;
  const origAmount = (base.amount != null && base.amount !== '') ? Number(base.amount) : null;
  let digits = (origAmount && origAmount > 0) ? String(Math.round(origAmount)) : '';
  let touched = false;
  let noteVal = base.note || '';
  let dueEdited = !!base.nextDue;
  let dueVal = base.nextDue || firstDueDate(repeat, day, every);
  let sugsHidden = false, noteFocused = false;
  const amountValue = ()=> touched ? Number(digits || 0) : (origAmount != null ? origAmount : Number(digits || 0));
  const KEYS = ['1','2','3','4','5','6','7','8','9','000','0','back'];
  const sizeClass = (shown)=> shown.length > 12 ? ' sm' : shown.length > 9 ? ' md' : '';

  function bodyHtml(){
    const cats = categoriesByUsage(state.transactions, type, allCats(type));
    const acc = state.accounts.find(a=>a.id === accountId);
    const accLabel = (skipAccount || !acc) ? 'Account' : acc.name;
    const shown = formatDigits(digits, CURRENCY_LOCALE);
    return `
      <div class="sheet-title sr-only">${existing ? 'Edit recurring' : 'New recurring entry'}</div>
      <div class="add-head">
        ${backFn ? `<button type="button" class="add-close" id="sheetBackBtn" aria-label="Back">${F_CHEVRON}</button>` : `<button type="button" class="add-close" id="addClose" aria-label="Close">${F_CLOSE}</button>`}
        <div class="segmented" id="recTypeSeg">
          <button type="button" data-val="expense" class="${type === 'expense' ? 'active' : ''}">Expense</button>
          <button type="button" data-val="income" class="${type === 'income' ? 'active' : ''}">Income</button>
        </div>
        ${existing ? `<button type="button" class="add-close danger" id="recDelete" aria-label="Delete">${F_BIN}</button>` : '<span class="add-head-spacer"></span>'}
      </div>
      <div class="add-amount">
        <div class="add-caption">${existing ? 'Editing recurring entry' : 'New recurring entry'}</div>
        <div class="amount-line${sizeClass(shown)}" id="amtLine"><span class="cur">${esc(state.settings.currency)}</span><span class="val num ${digits ? '' : 'zero'}" id="amtVal">${shown}</span><span class="caret"></span></div>
      </div>
      <div class="add-place">${F_PIN}<input type="text" id="recNote" autocomplete="off" enterkeyhint="done" placeholder="${type === 'expense' ? 'Name or place (optional)' : 'From (optional)'}" value="${esc(noteVal)}"></div>
      <div class="add-sugs" id="noteSuggest" style="display:none;"></div>
      <div class="add-tiles" id="recCatGrid">
        ${cats.map(c=>`<button type="button" class="cat-chip ${c.id === category ? 'active' : ''}" data-cat="${esc(c.id)}"><span class="sq">${catIconHtml(c, 19)}</span><span class="lb">${esc(c.label)}</span></button>`).join('')}
      </div>
      <div class="add-chips wrap">
        <button type="button" class="achip" id="recPersonChip"><span class="dot ${person}">${esc(personInitial(person))}</span><span id="recPersonText">${esc(person === 'p1' ? state.settings.person1 : state.settings.person2)}</span></button>
        ${state.accounts.length ? `<button type="button" class="achip ${skipAccount ? 'muted' : ''}" id="recAccChip">${F_CARD}<span id="recAccText">${esc(accLabel)}</span></button>` : ''}
        <button type="button" class="achip" id="repeatChip">${F_REPEAT}<span id="repeatChipText">${esc(repeatChipText(repeat, day, every))}</span></button>
        <label class="achip" id="dueChip">${F_CAL}<span id="dueChipText">Next · ${esc(shortDateLabel(dueVal))}</span><input type="date" id="recDue" value="${esc(dueVal)}"></label>
      </div>
      <div class="field-error" id="recErr"></div>
      <div class="add-keypad" id="keypad">
        ${KEYS.map(k=>`<button type="button" class="add-key ${k === '000' ? 'small' : ''}" data-k="${k}" ${k === 'back' ? 'aria-label="Delete"' : ''}>${k === 'back' ? F_BACKSPACE : k}</button>`).join('')}
      </div>
      <button type="button" class="add-save" id="recSave" ${amountValue() > 0 ? '' : 'disabled'}>${existing ? 'Save changes' : 'Add recurring entry'}</button>
    `;
  }

  showSheet(`<div id="recBody" class="add-body">${bodyHtml()}</div>`, (wrap)=>{ bind(wrap); }, 'sheet-add');

  function drawAmount(wrap){
    const shown = formatDigits(digits, CURRENCY_LOCALE);
    const v = wrap.querySelector('#amtVal');
    v.textContent = shown; v.classList.toggle('zero', !digits);
    wrap.querySelector('#amtLine').className = 'amount-line' + sizeClass(shown);
    wrap.querySelector('#recSave').disabled = !(amountValue() > 0);
    wrap.querySelector('#recErr').textContent = '';
  }
  function press(wrap, k){
    const next = keypadPress(digits, k, 12);
    if(next === digits) return;
    touched = true; digits = next; drawAmount(wrap);
    try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  }

  function bind(wrap){
    const sheetEl = wrap.querySelector('.sheet');
    const noteInput = wrap.querySelector('#recNote');
    const sugBox = wrap.querySelector('#noteSuggest');
    if(backFn) wireSheetBack(wrap, backFn);
    const closeBtn = wrap.querySelector('#addClose'); if(closeBtn) closeBtn.onclick = ()=> closeSheet(wrap);

    function showSuggestions(){
      if(sugsHidden || (existing && !noteFocused)){ sugBox.style.display = 'none'; return; }
      const list = noteSuggestions(state.transactions, type, noteInput.value, allCats(type).map(c=>c.id), 5);
      if(!list.length){ sugBox.style.display = 'none'; return; }
      sugBox.innerHTML = list.map((s, i)=>`<button type="button" class="sug" data-sug="${i}">${esc(s.note)}<small>${esc(fmt(s.amount))}</small></button>`).join('');
      sugBox.style.display = '';
      sugBox.querySelectorAll('.sug').forEach(b=>{
        b.onmousedown = (e)=> e.preventDefault();
        b.onclick = ()=> pick(list[Number(b.getAttribute('data-sug'))]);
      });
    }
    function pick(s){
      noteInput.value = s.note; noteVal = s.note; sugsHidden = true;
      if(!existing){
        if(s.category){ category = s.category; wrap.querySelectorAll('#recCatGrid .cat-chip').forEach(c=>c.classList.toggle('active', c.getAttribute('data-cat') === category)); }
        if(!(amountValue() > 0)){ digits = String(Math.round(s.amount)); touched = true; drawAmount(wrap); }
      }
      noteInput.blur(); showSuggestions();
    }
    noteInput.onfocus = ()=>{ noteFocused = true; sugsHidden = false; sheetEl.classList.add('typing'); showSuggestions(); };
    noteInput.oninput = ()=>{ noteVal = noteInput.value; sugsHidden = false; showSuggestions(); };
    noteInput.onblur = ()=>{ noteFocused = false; sheetEl.classList.remove('typing'); if(existing) showSuggestions(); };
    noteInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); noteInput.blur(); } };
    showSuggestions();

    wrap.querySelectorAll('#recTypeSeg button').forEach(b=>{
      b.onclick = ()=>{
        const next = b.getAttribute('data-val');
        if(next === type) return;
        noteVal = noteInput.value; dueVal = wrap.querySelector('#recDue').value || dueVal;
        type = next;
        category = mostUsedCategory(state.transactions, type, allCats(type)) || allCats(type)[0].id;
        skipAccount = type === 'expense' ? true : state.accounts.length === 0;
        sugsHidden = false;
        wrap.querySelector('#recBody').innerHTML = bodyHtml();
        bind(wrap);
      };
    });
    wrap.querySelectorAll('#recCatGrid .cat-chip').forEach(chip=>{
      chip.onclick = ()=>{ category = chip.getAttribute('data-cat'); wrap.querySelectorAll('#recCatGrid .cat-chip').forEach(c=>c.classList.toggle('active', c === chip)); };
    });
    const strip = wrap.querySelector('#recCatGrid'), on = wrap.querySelector('#recCatGrid .cat-chip.active');
    if(strip && on) strip.scrollLeft = Math.max(0, on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2);

    wrap.querySelector('#recPersonChip').onclick = ()=>{
      person = person === 'p1' ? 'p2' : 'p1';
      const dot = wrap.querySelector('#recPersonChip .dot');
      dot.className = 'dot ' + person; dot.textContent = personInitial(person);
      wrap.querySelector('#recPersonText').textContent = person === 'p1' ? state.settings.person1 : state.settings.person2;
    };
    const accChip = wrap.querySelector('#recAccChip');
    if(accChip){
      accChip.onclick = ()=> openAccountPickerSheet(accountId, skipAccount, type, (id)=>{
        if(id === '__none__'){ skipAccount = true; } else { skipAccount = false; accountId = id; }
        const acc = state.accounts.find(a=>a.id === accountId);
        wrap.querySelector('#recAccText').textContent = (skipAccount || !acc) ? 'Account' : acc.name;
        accChip.classList.toggle('muted', skipAccount);
      });
    }
    const dueInput = wrap.querySelector('#recDue');
    dueInput.onchange = ()=>{ dueVal = dueInput.value || dueVal; dueEdited = true; wrap.querySelector('#dueChipText').textContent = 'Next · ' + shortDateLabel(dueVal); };
    wrap.querySelector('#repeatChip').onclick = ()=> openRepeatPickerSheet({ repeat, day, every }, (v)=>{
      repeat = v.repeat; day = v.day; every = v.every;
      wrap.querySelector('#repeatChipText').textContent = repeatChipText(repeat, day, every);
      if(!dueEdited){            // "Next" follows the schedule until you choose a date yourself
        dueVal = firstDueDate(repeat, day, every);
        dueInput.value = dueVal; wrap.querySelector('#dueChipText').textContent = 'Next · ' + shortDateLabel(dueVal);
      }
    });

    wrap.querySelectorAll('#keypad .add-key').forEach(b=>{ b.onclick = ()=> press(wrap, b.getAttribute('data-k')); });

    wrap.querySelector('#recSave').onclick = ()=>{
      const err = (m)=>{ wrap.querySelector('#recErr').textContent = m; };
      const amount = amountValue();
      if(!(amount > 0)) return err('Enter an amount greater than 0.');
      const due = dueInput.value || dueVal;
      if(!due || !/^\d{4}-\d{2}-\d{2}$/.test(due)) return err('Select the next due date.');
      let acc = null;
      if(!skipAccount && state.accounts.length){
        acc = state.accounts.find(a=>a.id === accountId);
        if(!acc) return err('Select an account.');
      }
      const item = { type, amount, category, person, accountId: acc ? acc.id : null, note: noteInput.value.trim(), repeat, day: (day >= 1 && day <= 31) ? day : 1, every: (every >= 1) ? every : 1, nextDue: due };
      if(existing){ Object.assign(existing, item); }
      else { state.recurring = state.recurring || []; state.recurring.push(Object.assign({ id: uid(), createdAt: Date.now() }, item)); }
      saveState(); render(); closeSheet(wrap);
      if(backFn) backFn();
    };

    const delBtn = wrap.querySelector('#recDelete');
    if(delBtn){
      delBtn.onclick = ()=>{
        const idx = state.recurring.findIndex(x=>x.id === existing.id);
        const removed = state.recurring[idx];
        state.recurring = state.recurring.filter(x=>x.id !== existing.id);
        saveState(); render(); closeSheet(wrap);
        if(backFn) backFn();
        showUndoToast('Recurring entry deleted', ()=>{
          state.recurring.splice(Math.min(idx, state.recurring.length), 0, removed);
          saveState(); render();
        });
      };
    }
  }
}

// ---------- BACKUP & RESTORE ----------
function readFileAsText(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(String(r.result || ''));
    r.onerror = ()=> reject(new Error('read-failed'));
    r.readAsText(file);
  });
}

function openBackupSheet(){
  const bs = backupStatus();
  const html = `
    ${sheetNavHtml('Backup', true)}
    <div class="backup-summary">
      <div class="backup-summary-title">Your data</div>
      <div class="backup-summary-text">${state.accounts.length} accounts · ${state.transactions.length} transactions · ${state.budgets.length} budgets · ${state.foodItems.length} food items</div>
      <div class="backup-summary-text ${bs.stale ? 'stale' : ''}" id="lastBackupText">Last backup: ${esc(bs.text)}</div>
    </div>
    <button class="btn-primary" id="backupSaveBtn" style="margin-top:0">Save backup file</button>
    <button class="btn-secondary" id="backupCsvBtn">Export transactions (CSV)</button>
    <button class="btn-secondary" id="backupRestoreBtn">Restore from backup</button>
    <input type="file" id="backupFileInput" accept=".json,application/json,text/plain" style="display:none">
    <div class="status-msg" id="backupMsg"></div>
    <div class="hint">The backup file contains everything: accounts, transactions, budgets, categories and food items. On your phone this opens the share sheet, so you can pick “Save to Files”, Google Drive, or send it to yourself on WhatsApp.</div>
  `;
  showSheet(html, (wrap)=>{
    wireSheetBack(wrap, ()=>openSettingsSheet());
    const msg = (text, kind)=>{ const el = wrap.querySelector('#backupMsg'); el.textContent = text; el.className = 'status-msg ' + (kind || ''); };

    wrap.querySelector('#backupSaveBtn').onclick = async ()=>{
      try{
        const res = await deliverFile(backupFileName('backup', 'json'), 'application/json', JSON.stringify(buildBackupObject(), null, 2));
        if(res === 'cancelled') return;
        markBackupDone();
        const el = wrap.querySelector('#lastBackupText');
        el.textContent = 'Last backup: Today'; el.classList.remove('stale');
        msg(res === 'shared' ? 'Backup ready.' : 'Backup downloaded.', 'ok');
      }catch(e){ msg("Couldn't save the backup file on this device.", 'err'); }
    };

    wrap.querySelector('#backupCsvBtn').onclick = async ()=>{
      try{
        const res = await deliverFile(backupFileName('transactions', 'csv'), 'text/csv', transactionsToCsv());
        if(res === 'cancelled') return;
        msg(res === 'shared' ? 'Transactions exported.' : 'Transactions downloaded.', 'ok');
      }catch(e){ msg("Couldn't export the transactions.", 'err'); }
    };

    const input = wrap.querySelector('#backupFileInput');
    wrap.querySelector('#backupRestoreBtn').onclick = ()=> input.click();
    input.onchange = async ()=>{
      const file = input.files && input.files[0];
      input.value = '';
      if(!file) return;
      try{
        const result = parseBackupText(await readFileAsText(file));
        if(!result.ok){ msg(result.error, 'err'); return; }
        closeSheet(wrap);
        openRestoreConfirmSheet(result.data, result.meta);
      }catch(e){ msg("Couldn't read that file.", 'err'); }
    };
  });
}

function openRestoreConfirmSheet(data, meta){
  const when = meta && meta.exportedAt ? new Date(meta.exportedAt) : null;
  const whenText = when && !isNaN(when.getTime()) ? when.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : null;
  const row = (label, now, file)=>`<div class="compare-row"><span>${label}</span><span>${now}</span><span>${file}</span></div>`;
  const html = `
    ${sheetNavHtml('Restore backup', true)}
    <div id="restoreBody">
      <div class="compare-table">
        <div class="compare-row head"><span></span><span>Now</span><span>Backup file</span></div>
        ${row('Accounts', state.accounts.length, data.accounts.length)}
        ${row('Transactions', state.transactions.length, data.transactions.length)}
        ${row('Budgets', state.budgets.length, data.budgets.length)}
        ${row('Food items', state.foodItems.length, data.foodItems.length)}
      </div>
      ${whenText ? `<div class="hint" style="margin:0 0 12px 2px;">This backup was made on ${esc(whenText)}.</div>` : ''}
      <div class="warn-box">Restoring replaces everything in the app, on both phones. It can't be undone, so save a backup of the current data first if you're unsure.</div>
      <button class="btn-secondary" id="restoreSaveFirstBtn">Save a backup of the current data first</button>
      <button class="btn-primary danger" id="restoreConfirmBtn">Restore and replace everything</button>
      <div class="status-msg" id="restoreMsg"></div>
    </div>
  `;
  showSheet(html, (wrap)=>{
    wireSheetBack(wrap, ()=>openBackupSheet());
    const msg = (text, kind)=>{ const el = wrap.querySelector('#restoreMsg'); el.textContent = text; el.className = 'status-msg ' + (kind || ''); };

    wrap.querySelector('#restoreSaveFirstBtn').onclick = async ()=>{
      try{
        const res = await deliverFile(backupFileName('backup', 'json'), 'application/json', JSON.stringify(buildBackupObject(), null, 2));
        if(res === 'cancelled') return;
        markBackupDone();
        msg('Current data saved. You can restore now.', 'ok');
      }catch(e){ msg("Couldn't save the backup file on this device.", 'err'); }
    };

    const btn = wrap.querySelector('#restoreConfirmBtn');
    btn.onclick = async ()=>{
      btn.disabled = true; btn.textContent = 'Restoring';
      try{
        await restoreFromBackup(data);
        wrap.querySelector('#restoreBody').innerHTML = `
          <div class="restore-done">
            <div class="restore-done-icon">✓</div>
            <div class="restore-done-title">Backup restored</div>
            <div class="restore-done-text">${data.transactions.length} transactions, ${data.accounts.length} accounts, ${data.budgets.length} budgets and ${data.foodItems.length} food items are now in the app, and on your partner's phone too.</div>
            <button class="btn-primary" id="restoreDoneBtn">Done</button>
          </div>`;
        wrap.querySelector('#restoreDoneBtn').onclick = ()=> closeSheet(wrap);
      }catch(e){
        btn.disabled = false; btn.textContent = 'Restore and replace everything';
        const m = (e && e.message === 'not-ready') ? 'Still connecting. Try again in a moment.'
                : (e && e.message === 'busy') ? 'A save is in progress. Try again in a few seconds.'
                : "Couldn't restore. Check your connection and try again. Nothing was changed.";
        msg(m, 'err');
      }
    };
  });
}

function openAppearanceSettingsSheet(){
  const currentTheme = getThemePref();
  const html = `
    ${sheetNavHtml('Appearance', true)}
    <div class="segmented" id="themeSeg" style="margin-top:0">
      <button data-val="system" class="${currentTheme==='system'?'active':''}">System</button>
      <button data-val="light" class="${currentTheme==='light'?'active':''}">Light</button>
      <button data-val="dark" class="${currentTheme==='dark'?'active':''}">Dark</button>
    </div>
  `;
  showSheet(html, (wrap)=>{
    wireSheetBack(wrap, ()=>openSettingsSheet());
    wrap.querySelectorAll('#themeSeg button').forEach(b=>{
      b.onclick = ()=>{
        setThemePref(b.getAttribute('data-val'));
        wrap.querySelectorAll('#themeSeg button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      };
    });
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch((e)=> console.warn('Service worker registration failed', e));
  });
}

// ---------- LOGIN (email/password, resets daily) ----------
const LOGIN_KEY = 'app-login-timestamp';
const LOGIN_DURATION_MS = 24 * 60 * 60 * 1000; // 24 hours

function recordLogin(){
  try{ localStorage.setItem(LOGIN_KEY, String(Date.now())); }catch(e){}
}

function loginExpired(){
  try{
    const ts = Number(localStorage.getItem(LOGIN_KEY));
    if(!ts) return true;
    return (Date.now() - ts) > LOGIN_DURATION_MS;
  }catch(e){ return true; }
}

function clearLoginRecord(){
  try{ localStorage.removeItem(LOGIN_KEY); }catch(e){}
}

function showLoginScreen(errorMsg){
  document.getElementById('fab').style.display = 'none';
  const nav = document.getElementById('bottomNav');
  if(nav) nav.style.display = 'none';
  const root = document.getElementById('scroll-area');
  root.innerHTML = `
    <div id="pageInner">
    <div class="lock-screen">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--label-secondary); margin-bottom:14px;"><path d="M4 4h16v16H4z"></path><path d="M22 6l-10 7L2 6"></path></svg>
      <div class="lock-title">Sign in</div>
      <div class="lock-sub">Use your account email. You'll sign in again once a day.</div>
      <input type="email" id="loginEmail" class="pin-input" style="letter-spacing:normal; width:240px; text-align:left; font-size:15px; padding:12px 14px;" placeholder="name@example.com" autocomplete="username">
      <div style="height:10px"></div>
      <input type="password" id="loginPassword" class="pin-input" style="letter-spacing:normal; width:240px; text-align:left; font-size:15px; padding:12px 14px;" placeholder="Password" autocomplete="current-password">
      <div class="field-error" id="loginErr">${errorMsg ? esc(errorMsg) : ''}</div>
      <button class="btn-primary" id="loginSubmit" style="max-width:240px;">Sign in</button>
    </div>
    </div>
  `;
  const emailInput = document.getElementById('loginEmail');
  const passInput = document.getElementById('loginPassword');
  const submit = async ()=>{
    const email = emailInput.value.trim();
    const password = passInput.value;
    if(!email || !password){
      document.getElementById('loginErr').textContent = 'Enter your email and password.';
      return;
    }
    try{
      await firebase.auth().signInWithEmailAndPassword(email, password);
      recordLogin();
    }catch(e){
      document.getElementById('loginErr').textContent = 'Could not sign in. Check your email and password.';
    }
  };
  document.getElementById('loginSubmit').onclick = submit;
  passInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  emailInput.focus();
}

function afterLogin(){
  const raw = localStorage.getItem(LOGIN_KEY);
  if(!raw){
    recordLogin();
  } else if(loginExpired()){
    clearLoginRecord();
    firebase.auth().signOut();
    return;
  }
  setChromeVisible(false);   // shown again once the data has arrived
  loadState();
  render();                  // shows the loading screen right away
  setInterval(()=>{
    if(loginExpired()){
      clearLoginRecord();
      firebase.auth().signOut();
    }
  }, 5 * 60 * 1000);
}

function signOutApp(){
  clearLoginRecord();
  firebase.auth().signOut();
}

// ---------- BOOT ----------
if(!FIREBASE_CONFIGURED){
  showSetupBanner();
  render();
} else {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch((e)=> console.warn('Offline persistence unavailable:', e.code));
  firebase.auth().onAuthStateChanged((user)=>{
    if(user){
      afterLogin();
    } else {
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
      hasSyncedOnce = false; lastSyncedState = null; clearTimeout(loadSlowTimer);
      updateSyncPill();
      showLoginScreen();
    }
  });
}
