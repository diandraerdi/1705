  if(f.range === 'custom'){
    if(f.customStart && f.customEnd) return shortDate(f.customStart) + ' – ' + shortDate(f.customEnd);
    return 'Custom range';
  }
  return 'All time';
}

function historyMatchesFilters(t){
  const f = ui.historyFilter;
  if(f.type && t.type !== f.type) return false;
  if(f.person && t.person !== f.person) return false;
  if(f.categories && f.categories.length && !f.categories.includes(t.category)) return false;
  if(f.query){
    const q = f.query.toLowerCase();
    const info = catInfo(t.type, t.category);
    const acc = state.accounts.find(a=>a.id===t.accountId);
    const haystack = [info.label, personName(t.person), acc ? acc.name : '', t.note || ''].join(' ').toLowerCase();
    if(!haystack.includes(q)) return false;
  }
  if(f.range && f.range !== 'all'){
    if(!inFilterRange(t.date, f)) return false;
  }
  return true;
}

function resetHistoryFilter(){
  ui.historyFilter.range = 'all';
  ui.historyFilter.customStart = null;
  ui.historyFilter.customEnd = null;
  ui.historyFilter.person = null;
  ui.historyFilter.type = null;
  ui.historyFilter.categories = [];
}

function openHistoryWithFilter(overrides){
  resetHistoryFilter();
  ui.historyFilter.query = '';
  Object.assign(ui.historyFilter, overrides || {});
  goToView('history');
}

function activeQuickFilterSummary(){
  const f = ui.historyFilter;
  const parts = [];
  if(f.range !== 'all') parts.push(historyRangeLabel(f));
  if(f.person) parts.push(personName(f.person));
  if(f.type) parts.push(f.type === 'expense' ? 'Expenses' : 'Income');
  if(f.categories && f.categories.length) parts.push(f.categories.length + (f.categories.length===1?' category':' categories'));
  return parts.join(' · ');
}

function updateHistoryList(){
  const wrap = document.getElementById('historyListWrap');
  if(!wrap) return;
  const filtered = sortedTransactions().filter(historyMatchesFilters);
  wrap.innerHTML = filtered.length === 0
    ? `<div class="empty-state">No matching transactions.</div>`
    : renderTxList(filtered);
  bindTxRows(wrap);
}

function openHistoryFilterSheet(){
  let range = ui.historyFilter.range;
  let customStart = ui.historyFilter.customStart;
  let customEnd = ui.historyFilter.customEnd;

  const RANGE_OPTIONS = [
    {id:'all', label:'All time'},
    {id:'this_month', label:'This month'},
    {id:'last_month', label:'Last month'},
    {id:'this_year', label:'This year'},
    {id:'custom', label:'Custom range'},
  ];

  function bodyHtml(){
    return `
      <label class="field-label" style="margin-top:0">Date range</label>
      <div class="account-pick" id="histRangePick">
        ${RANGE_OPTIONS.map(r=>`<div class="account-pick-item ${r.id===range?'active':''}" data-range="${r.id}"><span class="n">${r.label}</span></div>`).join('')}
      </div>
      ${range==='custom' ? `
      <label class="field-label">From</label>
      <div class="date-field-wrap"><input type="date" id="histStart" value="${customStart||''}"></div>
      <label class="field-label">To</label>
      <div class="date-field-wrap"><input type="date" id="histEnd" value="${customEnd||''}"></div>
      ` : ''}
      <button class="btn-primary" id="histFilterApply">Apply</button>
    `;
  }

  const wrap = showSheet(`<div class="sheet-title">Filter activity</div><div id="histFilterBody">${bodyHtml()}</div>`, (w)=>bind(w));

  function bind(wrap){
    wrap.querySelectorAll('#histRangePick .account-pick-item').forEach(item=>{
      item.onclick = ()=>{
        range = item.getAttribute('data-range');
        wrap.querySelector('#histFilterBody').innerHTML = bodyHtml();
        bind(wrap);
      };
    });
    const csInput = wrap.querySelector('#histStart');
    const ceInput = wrap.querySelector('#histEnd');
    if(csInput) csInput.oninput = ()=>{ customStart = csInput.value; };
    if(ceInput) ceInput.oninput = ()=>{ customEnd = ceInput.value; };
    wrap.querySelector('#histFilterApply').onclick = ()=>{
      ui.historyFilter.range = range;
      ui.historyFilter.customStart = customStart;
      ui.historyFilter.customEnd = customEnd;
      render();
      closeSheet(wrap);
    };
  }
}

function render(){
  const root = document.getElementById('pageInner');
  openSwipeRow = null;

  if(FIREBASE_CONFIGURED && !hasSyncedOnce && !recoveryPromptShown){
    root.innerHTML = renderLoadingView();
    const retryBtn = document.getElementById('loadRetryBtn');
    if(retryBtn) retryBtn.onclick = retryLoad;
    return;
  }

  if(ui.tab === 'food'){
    root.classList.remove('reveal');
    root.innerHTML = renderFoodView();
    attachFoodListeners();
    return;
  }

  if(ui.view === 'history'){
    root.classList.remove('reveal');
    root.innerHTML = renderHistoryView();

    document.getElementById('historySearch').oninput = (e)=>{ ui.historyFilter.query = e.target.value; updateHistoryList(); };

    if(clearBtn) clearBtn.onclick = ()=>{ resetHistoryFilter(); render(); };
    updateHistoryList();
    return;
  }

  const bal = totalBalance();
  const spend = filteredSpend();
  const cur = esc(state.settings.currency);
  const heroPx = (s, base)=>{ const n = String(s).length; return n > 15 ? base - 18 : n > 13 ? base - 12 : n > 11 ? base - 6 : base; };
  let html = '';

  // ----- Total balance, with the accounts as chips -----
  const balStr = ui.showBalance ? fmtN(bal) : '••••••';
  html += `<div class="bc-card c-lav">
    <div class="bc-head"><span class="bc-pill static">Total balance</span><button class="bc-iconbtn" id="eyeBtn" aria-label="Show or hide balances">${icn(ui.showBalance ? 'eye' : 'eye-closed')}</button></div>

    <div class="bc-hs bc-chips" style="margin-top:22px">
      ${state.accounts.map(a=>`<span class="bc-chip" data-account="${a.id}"><span>${esc(a.name)}</span><b>${ui.showBalance ? esc(fmtN(a.balance)) : '••••'}</b></span>`).join('')}
      <span class="bc-chip add" id="addAccountCard">${icn('plus')}<span>${state.accounts.length === 0 ? 'Add your first account' : 'Add account'}</span></span>
    </div>
  </div>`;

  // ----- Needs you: due entries, food that is about to expire, the backup reminder -----
  const needs = [];
  const dueList = dueRecurring(state.recurring);
  dueList.forEach(r=>{
    const info = catInfo(r.type, r.category);
    const lbl = dateLabel(r.nextDue);
    const when = (lbl === 'Today' || lbl === 'Yesterday') ? lbl.toLowerCase() : lbl;
    needs.push(`<div class="bc-item" data-due="${r.id}">
      <div class="bc-itop">${catIconHtml(info, 26)}<span class="bc-sub">Due ${esc(when)}</span></div>
      <div class="bc-big2">${esc(r.note || info.label)}</div>
      <div class="bc-irow"><span class="bc-amt" style="font-size:20px">${r.type==='income' ? '+' : '−'}${esc(fmt(r.amount))}</span><button class="bc-skip" data-skip="${r.id}">Skip</button></div>
    </div>`);
  });
  const expiringItems = state.foodItems.filter(i=>{
    if(i.used) return false;
    const tone = expiryLabel(i.expiryDate).tone;
    return tone === 'red' || tone === 'orange';
  });
  if(expiringItems.length > 0){
    needs.push(`<div class="bc-item" id="expiryBanner">
      <div class="bc-itop">${icn('alarm', 26)}<span class="bc-sub">Food</span></div>
      <div class="bc-big2">${expiringItems.length} item${expiringItems.length===1?'':'s'} need${expiringItems.length===1?'s':''} attention</div>
      <div class="bc-irow"><span></span><span class="bc-go">Review${icn('nav-arrow-right')}</span></div>
    </div>`);
  }
  let backupSnoozeUntil = 0;
  try{ backupSnoozeUntil = Number(localStorage.getItem('backup-snooze-until')) || 0; }catch(e){}
  const lastBackup = getLastBackupAt();
  if(shouldShowBackupReminder(lastBackup, backupSnoozeUntil)){
    const backupDays = (lastBackup && !isNaN(lastBackup.getTime())) ? Math.floor((Date.now() - lastBackup.getTime()) / 86400000) : null;
    needs.push(`<div class="bc-item" id="backupBanner">
      <div class="bc-itop">${icn('download', 26)}<span class="bc-sub">Backup</span></div>
      <div class="bc-big2">${backupDays === null ? 'Save a backup' : 'Back up your data'}</div>
      <div class="bc-irow"><button class="bc-skip" id="backupSnooze" aria-label="Remind me later" style="padding-left:0">Later</button><span class="bc-go">Back up${icn('nav-arrow-right')}</span></div>

  if(needs.length > 0){

      <div class="bc-head"><span class="bc-pill static">Needs you</span><span class="bc-ttl" style="font-size:15px">${needs.length}</span></div>
      <div class="bc-hs" style="margin-top:18px">${needs.join('')}</div>
      ${needs.length > 1 ? `<div class="bc-dots">${needs.map((_, i)=>`<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    </div>`;
  }

  // ----- Expenses: Summary / Trend / Categories -----
  const trendMonths = getTrendMonths();
  const cmp = ui.expenseTab === 'summary' ? comparePeriods(state.transactions, ui.spendFilter) : null;
  const cmpHtml = (c, long)=>{
    if(!c || !c.change) return '';

    const text = ch.arrow === '≈' ? `≈ Flat vs ${label}` : `${ch.arrow} ${ch.text} vs ${label}`;
    return `<div class="spend-cmp ${ch.tone}">${text}</div>`;
  };
  const recapMonth = recapMonthForFilter();
  const tabBtn = (v, t)=> `<button class="bc-pill${ui.expenseTab===v?' on':''}" data-val="${v}">${t}</button>`;
  const allStr = fmtN(spend.all || 0);

    const pct = (spend.all || 0) > 0 ? Math.round((amt / spend.all) * 100) : 0;
    return `<div class="bc-share" id="${id}"><span class="n">${esc(who)}</span><span class="bc-track"><span class="bc-fill" style="width:${pct}%"></span></span><span class="a"><div class="bc-amt">${esc(fmtN(amt))}</div>${cmpHtml(cmpC, false)}</span></div>`;
  };
  let expBody = '';
  if(ui.expenseTab === 'summary'){
    expBody = `<div class="bc-line" style="margin-top:22px"><span class="bc-sub">${esc(filterLabel(ui.spendFilter))}</span></div>
      <div id="spendAllCard" style="cursor:pointer"><div class="bc-hero" style="margin-top:8px; font-size:${heroPx(allStr, 52)}px"><small>${cur}</small>${allStr}</div>${cmpHtml(cmp && cmp.all, true)}</div>
      <div style="margin-top:18px">${shareRow('spendCardP1', state.settings.person1, spend.p1 || 0, cmp && cmp.p1)}${shareRow('spendCardP2', state.settings.person2, spend.p2 || 0, cmp && cmp.p2)}</div>`;
  } else if(ui.expenseTab === 'trend'){
    expBody = `<div class="bc-sub" style="margin-top:22px">${esc(trendPeriodLabel(trendMonths))}</div>${renderTrendChart(trendMonths)}`;
  } else {
    expBody = `<div class="bc-sub" style="margin-top:22px">${esc(filterLabel(ui.spendFilter))}</div>${renderCategoryPie()}`;
  }
  html += `<div class="bc-card c-yellow">
    <div class="bc-head"><div class="bc-tabs" id="expenseTabChips">${tabBtn('summary', 'Summary')}${tabBtn('trend', 'Trend')}${tabBtn('categories', 'Categories')}</div>
      ${ui.expenseTab === 'trend' ? `<button class="bc-iconbtn" id="trendPeriodBtn" aria-label="Choose period">${icn('calendar')}</button>` : `<button class="bc-iconbtn" id="spendFilterBtn" aria-label="Filter">${icn('filter-list')}</button>`}
    </div>
    ${expBody}
  </div>`;
  if(ui.expenseTab === 'summary'){
    html += `<div class="bc-card c-lav" id="openRecapBtn" role="button" style="cursor:pointer"><div class="bc-head"><span class="bc-pill static">Monthly recap</span><span class="bc-link">${esc(monthLabel(recapMonth.y, recapMonth.m))}${icn('nav-arrow-right')}</span></div></div>`;
  }

  // ----- Budgets -----
  html += `<div class="bc-card c-sage"><div class="bc-head"><span class="bc-pill static">Budgets</span><button class="bc-iconbtn" id="addBudgetBtn" aria-label="Add budget">${icn('plus')}</button></div>`;
  if(state.budgets.length === 0){
    html += `<div class="bc-empty">No budgets yet. Set a monthly limit per category.</div>`;
  } else {
    html += `<div style="margin-top:10px">`;
    state.budgets.forEach(b=>{
      const spent = budgetSpent(b.category);
      const pace = budgetPace(b.limit, spent);
      const pct = Math.min(100, Math.round((spent / Math.max(1,b.limit))*100));
      const info = catInfo('expense', b.category);
      const hot = pace.status === 'over' || pace.status === 'warn' || pct > 80;
      let paceText;
      if(pace.status === 'over') paceText = pace.over > 0 ? `Over budget by ${fmt(pace.over)}` : 'Budget used up';
      else if(pace.status === 'warn') paceText = `On pace to spend ${fmt(pace.projected)}, ${fmt(pace.projectedOver)} over`;
      else paceText = `${fmt(pace.remaining)} left · about ${fmt(pace.perDay)} a day`;
      html += `<div class="bc-bud" data-budget="${b.id}">
        <div class="t">${catIconHtml(info, 25)}<span class="bc-ttl">${esc(info.label)}</span><span class="bc-sub"><b>${esc(fmtN(spent))}</b> of ${esc(fmtN(b.limit))}</span></div>
        <div class="bc-track"><div class="bc-fill${hot ? ' hot' : ''}" style="width:${pct}%"></div><div class="bc-tick" style="left:${(pace.expectedPct * 100).toFixed(1)}%"></div></div>
        <div class="budget-pace ${pace.status}">${paceText}</div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // ----- Recent activity (capped at 5, with a link to the full history) -----
  const sortedAll = sortedTransactions();
  html += `<div class="bc-card c-lav bc-recent"><div class="bc-head"><span class="bc-pill static">Recent activity</span>${sortedAll.length > 5 ? `<button class="bc-link" id="seeAllBtn">See all${icn('nav-arrow-right')}</button>` : ''}</div>`;
  if(sortedAll.length === 0){
    html += `<div class="bc-empty">No transactions yet. Tap + to add one.</div>`;
  } else {
    html += renderTxList(sortedAll.slice(0,5), sortedAll);

  html += `</div>`;

  const revealKey = ui.expenseTab + '|' + JSON.stringify(ui.spendFilter) + '|' + trendMonths.map(m=>m.getTime()).join(',');
  root.classList.toggle('reveal', revealKey !== lastRevealKey); lastRevealKey = revealKey;
  root.innerHTML = html;
  attachHomeListeners();
  fitHeroes(root);
  const needHs = root.querySelector('.bc-need .bc-hs');
  if(needHs) needHs.addEventListener('scroll', ()=>{
    const it = needHs.querySelector('.bc-item'); if(!it) return;
    const idx = Math.round(needHs.scrollLeft / (it.offsetWidth + 18));
    needHs.parentNode.querySelectorAll('.bc-dots i').forEach((d, i)=> d.classList.toggle('on', i === idx));
  }, { passive: true });
}

function goToView(view){
  const pageInner = document.getElementById('pageInner');
  const scrollArea = document.getElementById('scroll-area');
  const goingForward = view === 'history';
  const outClass = goingForward ? 'slide-out-left' : 'slide-out-right';
  const inClass = goingForward ? 'slide-in-right' : 'slide-in-left';

  if(!pageInner){
    ui.view = view;
    render();
    return;
  }

  pageInner.classList.add(outClass);
  setTimeout(()=>{
    ui.view = view;
    render();
    if(scrollArea) scrollArea.scrollTop = 0;
    const freshInner = document.getElementById('pageInner');
    if(freshInner){
      freshInner.classList.remove('slide-out-left', 'slide-out-right');
      freshInner.classList.add(inClass);
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          freshInner.classList.remove(inClass);
        });
      });
    }
  }, 160);
}

// ---------- FOOD TAB ----------
function sortedFoodItems(){
  return [...state.foodItems].sort((a,b)=> new Date(a.expiryDate) - new Date(b.expiryDate));
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d - today) / (1000*60*60*24));
}

function expiryLabel(dateStr){
  const days = daysUntil(dateStr);
  if(days < 0) return { text: `Expired ${Math.abs(days)}d ago`, tone: 'red' };
  if(days === 0) return { text: 'Expires today', tone: 'red' };
  if(days === 1) return { text: 'Expires tomorrow', tone: 'orange' };
  if(days <= 3) return { text: `Expires in ${days}d`, tone: 'orange' };
  return { text: `Expires in ${days}d`, tone: 'normal' };
}

function checkedSVG(){
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
}

function renderFoodView(){
  const filter = ui.foodFilter;
  const all = sortedFoodItems();
  const unused = all.filter(i=>!i.used);
  const used = all.filter(i=>i.used).reverse();
  const tone = (i)=> expiryLabel(i.expiryDate).tone;
  const attention = unused.filter(i=> tone(i) === 'red' || tone(i) === 'orange');
  const week = unused.filter(i=> !attention.includes(i) && daysUntil(i.expiryDate) <= 7);
  const later = unused.filter(i=> !attention.includes(i) && !week.includes(i));
  const expiredN = unused.filter(i=> daysUntil(i.expiryDate) < 0).length;
  const frow = (i)=>{
    const n = daysUntil(i.expiryDate);
    let right;
    if(i.used){
      right = `<button class="food-rebuy" data-rebuy="${i.id}">${icn('refresh-double')}Buy again</button>`;
    } else if(n < 0){
      right = `<span class="pill-expired">Expired ${-n}d</span>`;
    } else {
      const main = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : `In ${n} days`;
      right = `<div class="bc-e"><div class="bc-amt">${main}</div><div class="bc-sub">${esc(expiryLongLabel(i.expiryDate))}</div></div>`;
    }
    const sub = i.used ? `${i.amount ? esc(i.amount) + ' · ' : ''}${esc(expiryLongLabel(i.expiryDate))}` : (i.amount ? esc(i.amount) : '&nbsp;');
    return `<div class="bc-frow ${i.used ? 'food-used' : ''}" data-food="${i.id}"><button class="food-check ${i.used ? 'checked' : ''}" data-foodcheck="${i.id}" aria-label="Mark as used">${i.used ? icn('check') : ''}</button><div class="bc-m"><div class="bc-ttl">${esc(i.name)}</div><div class="bc-sub">${sub}</div></div>${right}</div>`;
  };
  const group = (color, label, list)=> list.length ? `<div class="bc-card ${color}"><div class="bc-head"><span class="bc-pill static">${label}</span><span class="bc-ttl" style="font-size:15px">${list.length}</span></div><div style="margin-top:6px">${list.map(frow).join('')}</div></div>` : '';
  let stat;
  if(filter === 'used'){
    stat = `<div class="bc-stat"><div class="bc-hero" style="font-size:96px">${used.length}</div><div class="bc-ttl">items<br>used</div></div><div class="bc-sub" style="margin-top:12px; font-size:14px">${used.length ? 'Tap Buy again to restock' : 'Nothing marked as used yet.'}</div>`;
  } else if(attention.length > 0){
    const soon = attention.length - expiredN;
    stat = `<div class="bc-stat"><div class="bc-hero" style="font-size:96px">${attention.length}</div><div class="bc-ttl">item${attention.length === 1 ? '' : 's'} need${attention.length === 1 ? 's' : ''}<br>attention</div></div><div class="bc-sub" style="margin-top:12px; font-size:14px">${[expiredN ? expiredN + ' expired' : '', soon ? soon + ' expire within 3 days' : ''].filter(Boolean).join(', ')}</div>`;
  } else {
    stat = `<div class="bc-hero" style="font-size:56px">${unused.length ? 'All good' : 'Nothing yet'}</div><div class="bc-sub" style="margin-top:12px; font-size:14px">${unused.length ? 'Nothing expires within 3 days' : 'Tap + to add food.'}</div>`;
  }
  let html = `<div class="bc-pagetabs"><button class="bc-pill ${filter==='unused'?'on':''}" data-foodfilter="unused">Unused <b>${unused.length}</b></button><button class="bc-pill ${filter==='used'?'on':''}" data-foodfilter="used">Used <b>${used.length}</b></button></div>
  <div class="bc-card c-lav">${stat}</div>`;
  if(filter === 'used'){
    html += used.length ? group('c-sage', 'Used', used) : '';
  } else if(unused.length === 0){
    html += `<div class="bc-card c-sage"><div class="bc-empty" style="padding-top:0">No food items yet. Tap + to add one.</div></div>`;
  } else {
    html += group('c-coral', 'Needs attention', attention) + group('c-yellow', 'This week', week) + group('c-sage', 'Later', later);
  }
  return html;
}

function attachFoodListeners(){
  document.querySelectorAll('[data-foodfilter]').forEach(btn=>{
    btn.onclick = ()=>{ ui.foodFilter = btn.getAttribute('data-foodfilter'); render(); };
  });
  document.querySelectorAll('[data-foodcheck]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-foodcheck');
      const item = state.foodItems.find(f=>f.id===id);
      if(item){ item.used = !item.used; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-rebuy]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const item = state.foodItems.find(f=>f.id === btn.getAttribute('data-rebuy'));
      if(item) openFoodFormSheet(null, rebuyPrefill(item));
    };
  });
  document.querySelectorAll('[data-food]').forEach(row=>{
    row.onclick = ()=> openEditFoodSheet(row.getAttribute('data-food'));
  });
}

function rebuyPrefill(item){
  const days = suggestShelfLifeDays(item.name, state.foodItems);
  return { rebuy: true, name: item.name, amount: item.amount || '', expiryDate: days ? addDaysISO(todayISO(), days) : '', suggestedDays: days };
}

function openAddFoodSheet(){
  openFoodFormSheet(null);
}

function openEditFoodSheet(id){
  const item = state.foodItems.find(f=>f.id===id);
  if(!item) return;
  openFoodFormSheet(item);
}

function openFoodFormSheet(existing, prefill){
  prefill = prefill || {};
  const src = existing || prefill;
  let nameVal = src.name || '';
  let expiry = existing ? (existing.expiryDate || '') : (prefill.expiryDate || '');
  let suggestedDays = existing ? null : (prefill.suggestedDays || (nameVal ? suggestShelfLifeDays(nameVal, state.foodItems) : null));
  let sugsHidden = false, nameFocused = false;
  const title = existing ? 'Edit food item' : (prefill.rebuy ? 'Buy again' : 'Add food item');
  const caption = existing ? 'Edit food item' : (prefill.rebuy ? 'Buy again' : 'New food item');

  function chipsHtml(){
    const t = todayISO(), list = [];
    if(suggestedDays) list.push({ days: suggestedDays, label: 'Like last time · ' + suggestedDays + (suggestedDays === 1 ? ' day' : ' days'), hint: true });
    EXPIRY_PRESETS.forEach(p=>{ if(p.days !== suggestedDays) list.push({ days: p.days, label: p.label, hint: false }); });
    return list.map(c=>`<button type="button" class="opt-chip${c.hint ? ' hint' : ''}${expiry && expiry === addDaysISO(t, c.days) ? ' active' : ''}" data-days="${c.days}">${esc(c.label)}</button>`).join('');
  }
  function expiryLine(){
    if(!expiry) return { text: 'Choose how long it will last', tone: '' };
    const d = describeExpiry(expiry);
    return { text: d.text + ' · ' + expiryLongLabel(expiry), tone: d.tone };
  }
  function bodyHtml(){
    const line = expiryLine();
    return `
      <div class="sheet-title sr-only">${title}</div>
      <div class="add-head">
        <button type="button" class="add-close" id="addClose" aria-label="Close">${F_CLOSE}</button>
        <div class="food-caption">${caption}</div>
        ${existing ? `<button type="button" class="add-close danger" id="foodDelete" aria-label="Delete">${F_BIN}</button>` : '<span class="add-head-spacer"></span>'}
      </div>
      <div class="food-hero"><input type="text" id="foodName" class="food-hero-input" autocomplete="off" enterkeyhint="next" placeholder="What did you buy?" value="${esc(nameVal)}"></div>
      <div class="add-sugs" id="foodSuggest" style="display:none;"></div>
      <div class="add-place">${F_BOX}<input type="text" id="foodAmount" autocomplete="off" enterkeyhint="done" placeholder="Amount (optional), e.g. 500g, 2 packs" value="${esc(src.amount || '')}"></div>
      <div class="food-label">How long will it last?</div>
      <div class="add-sugs food-presets" id="expiryPresets"><span id="presetChips" style="display:contents">${chipsHtml()}</span><label class="opt-chip" id="expDateChip">${F_CAL}<span id="expDateText">${expiry ? esc(shortDateLabel(expiry)) : 'Pick date'}</span><input type="date" id="foodExpiry" value="${esc(expiry)}"></label></div>
      <div class="food-expiry-line ${line.tone}" id="expiryLine">${esc(line.text)}</div>
      <div class="field-error" id="foodErr"></div>
      <button type="button" class="add-save" id="foodSave">${existing ? 'Save changes' : 'Add to food list'}</button>
    `;
  }
  showSheet(`<div class="add-body food-form">${bodyHtml()}</div>`, (wrap)=>{
    const sheetEl = wrap.querySelector('.sheet');
    const nameInput = wrap.querySelector('#foodName'), amountInput = wrap.querySelector('#foodAmount');
    const sugBox = wrap.querySelector('#foodSuggest'), dateInput = wrap.querySelector('#foodExpiry');
    wrap.querySelector('#addClose').onclick = ()=> closeSheet(wrap);

    function refreshExpiry(){
      wrap.querySelector('#presetChips').innerHTML = chipsHtml();
      bindChips();
      const line = expiryLine(), el = wrap.querySelector('#expiryLine');
      el.textContent = line.text; el.className = 'food-expiry-line ' + line.tone;
      wrap.querySelector('#expDateText').textContent = expiry ? shortDateLabel(expiry) : 'Pick date';
      dateInput.value = expiry;
      wrap.querySelector('#foodErr').textContent = '';
    }
    function bindChips(){
      wrap.querySelectorAll('#presetChips .opt-chip').forEach(b=>{
        b.onclick = ()=>{ expiry = addDaysISO(todayISO(), Number(b.getAttribute('data-days'))); refreshExpiry(); };
      });
    }
    dateInput.onchange = ()=>{ expiry = dateInput.value; refreshExpiry(); };
    bindChips();

    function showSuggestions(){
      if(sugsHidden || (existing && !nameFocused)){ sugBox.style.display = 'none'; return; }
      const list = foodSuggestions(state.foodItems, nameInput.value, 6);
      if(!list.length){ sugBox.style.display = 'none'; return; }
      sugBox.innerHTML = list.map((s, i)=>`<button type="button" class="sug" data-sug="${i}">${esc(s.name)}<small>${s.days ? '~' + s.days + ' days' : esc(s.amount || '')}</small></button>`).join('');
      sugBox.style.display = '';
      sugBox.querySelectorAll('.sug').forEach(b=>{
        b.onmousedown = (e)=> e.preventDefault();
        b.onclick = ()=> pick(list[Number(b.getAttribute('data-sug'))]);
      });
    }
    function pick(s){
      nameInput.value = s.name; nameVal = s.name; sugsHidden = true;
      if(!existing){
        if(!amountInput.value.trim() && s.amount) amountInput.value = s.amount;
        suggestedDays = s.days || null;
        if(s.days) expiry = addDaysISO(todayISO(), s.days);       // same shelf life as last time
      }
      nameInput.blur(); showSuggestions(); refreshExpiry();
    }
    nameInput.onfocus = ()=>{ nameFocused = true; sugsHidden = false; sheetEl.classList.add('typing'); showSuggestions(); };
    nameInput.oninput = ()=>{
      nameVal = nameInput.value; sugsHidden = false;
      if(!existing) suggestedDays = suggestShelfLifeDays(nameVal, state.foodItems);
      showSuggestions(); refreshExpiry();
    };
    nameInput.onblur = ()=>{ nameFocused = false; sheetEl.classList.remove('typing'); if(existing) showSuggestions(); };
    nameInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); nameInput.blur(); } };
    amountInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); amountInput.blur(); } };
    showSuggestions();

    wrap.querySelector('#foodSave').onclick = ()=>{
      const name = nameInput.value.trim();
      const amount = amountInput.value.trim();
      const expiryDate = dateInput.value;
      if(!name){ wrap.querySelector('#foodErr').textContent = 'Enter an item name.'; return; }
      if(!expiryDate){ wrap.querySelector('#foodErr').textContent = 'Select an expiry date.'; return; }
      if(existing){
        existing.name = name; existing.amount = amount; existing.expiryDate = expiryDate;
      } else {
        state.foodItems.push({ id: uid(), name, amount, expiryDate, used: false, createdAt: Date.now() });
        if(prefill.rebuy) ui.foodFilter = 'unused';
      }
      saveState(); render(); closeSheet(wrap);
    };
    if(existing){
      wrap.querySelector('#foodDelete').onclick = ()=>{
        const idx = state.foodItems.findIndex(f=>f.id === existing.id);
        const removed = state.foodItems[idx];
        state.foodItems = state.foodItems.filter(f=>f.id !== existing.id);
        saveState(); render(); closeSheet(wrap);
        showUndoToast('Food item deleted', ()=>{
          state.foodItems.splice(Math.min(idx, state.foodItems.length), 0, removed);
          saveState(); render();
        });
      };
    }
  }, 'sheet-add');
}

let tabSwitching = false;
function switchTab(tab){
  if(tab === ui.tab || tabSwitching) return;
  const forward = tab === 'food';              // Finance -> Food slides left, Food -> Finance slides right
  const inner = document.getElementById('pageInner'), scrollArea = document.getElementById('scroll-area');
  ui.tab = tab; ui.view = 'home';
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab') === tab));
  lastRevealKey = null;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!inner || reduce){ render(); if(scrollArea) scrollArea.scrollTop = 0; return; }
  tabSwitching = true;
  inner.classList.add(forward ? 'tab-out-left' : 'tab-out-right');
  setTimeout(()=>{
    render(); if(scrollArea) scrollArea.scrollTop = 0;
    const fresh = document.getElementById('pageInner');
    if(fresh){
      const inClass = forward ? 'tab-in-right' : 'tab-in-left';
      fresh.style.transition = 'none';
      fresh.classList.remove('tab-out-left', 'tab-out-right'); fresh.classList.add(inClass);
      void fresh.offsetWidth;                  // jump to the entry position without animating...
      fresh.style.transition = '';
      fresh.classList.remove(inClass);         // ...then slide into place
    }
    setTimeout(()=>{ tabSwitching = false; }, 240);
  }, 170);
}
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.onclick = ()=> switchTab(btn.getAttribute('data-tab'));
});

(function(){
  const scrollAreaEl = document.getElementById('scroll-area');
  let lastScrollTop = 0;
  scrollAreaEl.addEventListener('scroll', ()=>{
    const st = scrollAreaEl.scrollTop;
    const fab = document.getElementById('fab');
    const nav = document.getElementById('bottomNav');
    if(!fab) return;
    if(st > lastScrollTop && st > 40){
      fab.classList.add('fab-hidden');
      if(nav) nav.classList.add('nav-hidden');
    } else {
      fab.classList.remove('fab-hidden');
      if(nav) nav.classList.remove('nav-hidden');
    }
    lastScrollTop = st <= 0 ? 0 : st;
  }, { passive: true });
})();

async function doRefresh(){
  await refreshFromServer();
  await new Promise((resolve)=> setTimeout(resolve, 350));
}

(function(){
  const scrollAreaEl = document.getElementById('scroll-area');
  const indicator = document.getElementById('pullIndicator');
  const THRESHOLD = 64;
  let startY = 0, pulling = false, currentPull = 0, refreshing = false;

  scrollAreaEl.addEventListener('touchstart', (e)=>{
    if(refreshing) return;
    if(scrollAreaEl.scrollTop <= 0){
      startY = e.touches[0].clientY;
      pulling = true;
    } else {
      pulling = false;
    }
  }, { passive: true });

  scrollAreaEl.addEventListener('touchmove', (e)=>{
    if(!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if(dy > 0 && scrollAreaEl.scrollTop <= 0){
      currentPull = Math.min(dy * 0.5, 90);
      indicator.style.transition = 'none';
      indicator.style.transform = `translateY(${currentPull}px)`;
      indicator.style.opacity = String(Math.min(currentPull / THRESHOLD, 1));
      if(currentPull > 10 && e.cancelable) e.preventDefault();
    }
  }, { passive: false });

  scrollAreaEl.addEventListener('touchend', ()=>{
    if(!pulling || refreshing) return;
    pulling = false;
    indicator.style.transition = '';
    if(currentPull >= THRESHOLD){
      refreshing = true;
      indicator.style.transform = 'translateY(46px)';
      indicator.style.opacity = '1';
      doRefresh().finally(()=>{
        indicator.style.transform = 'translateY(-6px)';
        indicator.style.opacity = '0';
        refreshing = false;
      });
    } else {
      indicator.style.transform = 'translateY(-6px)';
      indicator.style.opacity = '0';
    }
    currentPull = 0;
  });
})();

// ---------- SHEET FRAMEWORK ----------
function showSheet(innerHtml, onMount, sheetClass){
  const host = document.getElementById('sheetHost');
  const wrap = document.createElement('div');
  wrap.className = 'sheet-overlay';
  wrap.innerHTML = `<div class="sheet${sheetClass ? ' ' + sheetClass : ''}"><div class="sheet-handle"></div>${innerHtml}</div>`;
  host.appendChild(wrap);
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) closeSheet(wrap); });
  void wrap.offsetHeight;   // draw the closed position first, so the sheet slides up
  wrap.classList.add('open');
  if(onMount) onMount(wrap);
  return wrap;
}
function closeSheet(wrap){
  wrap.classList.remove('open');
  setTimeout(()=> wrap.remove(), 400);
}

function openAddTxSheet(opts){
  opts = opts || {};
  const editingTx = opts.editingTx || null;
  const prefill = editingTx ? { amount: editingTx.amount, note: editingTx.note, date: editingTx.date } : (opts.prefill || {});
  let txType = editingTx ? editingTx.type : (opts.txType || 'expense');
  let category = editingTx ? editingTx.category : (prefill.category || mostUsedCategory(state.transactions, txType, allCats(txType)) || allCats(txType)[0].id);
  let person = editingTx ? editingTx.person : (opts.person || getDefaultPerson());
  const presetAcc = (!editingTx && opts.accountId !== undefined) ? (state.accounts.find(a=>a.id === opts.accountId) ? opts.accountId : null) : undefined;
  let skipAccount = editingTx ? !editingTx.accountId : (presetAcc !== undefined ? !presetAcc : (txType === 'expense' ? true : state.accounts.length === 0));

  const origAmount = (prefill.amount != null && prefill.amount !== '') ? Number(prefill.amount) : null;
  let digits = (origAmount && origAmount > 0) ? String(Math.round(origAmount)) : '';
  let touched = false;                       // an amount you never touched is saved exactly as it was
  let noteVal = prefill.note || '';
  let dateVal = prefill.date || todayISO();
  let sugsHidden = false, noteFocused = false;
  const amountValue = ()=> touched ? Number(digits || 0) : (origAmount != null ? origAmount : Number(digits || 0));

  const PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const CAL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
  const CARD = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>';
  const BACK = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg>';
  const KEYS = ['1','2','3','4','5','6','7','8','9','000','0','back'];

  function sizeClass(shown){ return shown.length > 12 ? ' sm' : shown.length > 9 ? ' md' : ''; }

  function bodyHtml(){
    const cats = categoriesByUsage(state.transactions, txType, allCats(txType));
    const acc = state.accounts.find(a=>a.id === accountId);
    const accLabel = (skipAccount || !acc) ? 'Account' : acc.name;
    const shown = formatDigits(digits, CURRENCY_LOCALE);
    return `
      <div class="sheet-title sr-only">${editingTx ? 'Edit transaction' : 'Add transaction'}</div>
      <div class="add-head">
        <button type="button" class="add-close" id="addClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="segmented" id="txTypeSeg">
          <button type="button" data-val="expense" class="${txType==='expense'?'active':''}">Expense</button>
          <button type="button" data-val="income" class="${txType==='income'?'active':''}">Income</button>
        </div>
        <span class="add-head-spacer"></span>
      </div>
      <div class="add-amount">
        ${editingTx ? '<div class="add-caption">Editing entry</div>' : ''}
        <div class="amount-line${sizeClass(shown)}" id="amtLine"><span class="cur">${esc(state.settings.currency)}</span><span class="val num ${digits ? '' : 'zero'}" id="amtVal">${shown}</span><span class="caret"></span></div>
      </div>
      <div class="add-place">${PIN}<input type="text" id="txNote" autocomplete="off" enterkeyhint="done" placeholder="${txType==='expense' ? 'Place (optional)' : 'From (optional)'}" value="${esc(noteVal)}"></div>
      <div class="add-sugs" id="noteSuggest" style="display:none;"></div>
      <div class="add-tiles" id="catGrid">
        ${cats.map(c=>`<button type="button" class="cat-chip ${c.id===category?'active':''}" data-cat="${esc(c.id)}"><span class="sq">${catIconHtml(c, 19)}</span><span class="lb">${esc(c.label)}</span></button>`).join('')}
      </div>
      <div class="add-chips">
        <button type="button" class="achip" id="personChip"><span class="dot ${person}">${esc(personInitial(person))}</span><span id="personChipText">${esc(person === 'p1' ? state.settings.person1 : state.settings.person2)}</span></button>
        <label class="achip" id="dateChip">${CAL}<span id="dateChipText">${esc(shortDateLabel(dateVal))}</span><input type="date" id="txDate" value="${esc(dateVal)}"></label>
        ${state.accounts.length ? `<button type="button" class="achip ${skipAccount ? 'muted' : ''}" id="accChip">${CARD}<span id="accChipText">${esc(accLabel)}</span></button>` : ''}
      </div>
      <div class="field-error" id="txErr"></div>
      <div class="add-keypad" id="keypad">
        ${KEYS.map(k=>`<button type="button" class="add-key ${k==='000' ? 'small' : ''}" data-k="${k}" ${k==='back' ? 'aria-label="Delete"' : ''}>${k==='back' ? BACK : k}</button>`).join('')}
      </div>
      <button type="button" class="add-save" id="txSave" ${amountValue() > 0 ? '' : 'disabled'}>${editingTx ? 'Save changes' : 'Save ' + (txType === 'expense' ? 'expense' : 'income')}</button>
    `;
  }

  showSheet(`<div id="addBody" class="add-body">${bodyHtml()}</div>`, mount, 'sheet-add');

  function mount(wrap){
    bind(wrap);
    const onKey = (e)=>{
      if(!document.body.contains(wrap)){ document.removeEventListener('keydown', onKey); return; }
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
      if(/^[0-9]$/.test(e.key)) press(wrap, e.key);
      else if(e.key === 'Backspace') press(wrap, 'back');
    };
    document.addEventListener('keydown', onKey);
  }

  function drawAmount(wrap){
    const shown = formatDigits(digits, CURRENCY_LOCALE);
    const v = wrap.querySelector('#amtVal');
    v.textContent = shown; v.classList.toggle('zero', !digits);
    wrap.querySelector('#amtLine').className = 'amount-line' + sizeClass(shown);
    wrap.querySelector('#txSave').disabled = !(amountValue() > 0);
    wrap.querySelector('#txErr').textContent = '';
  }
  function press(wrap, k){
    const next = keypadPress(digits, k, 12);
    if(next === digits) return;
    touched = true; digits = next;
    drawAmount(wrap);
    try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  }

  function bind(wrap){
    const sheetEl = wrap.querySelector('.sheet');
    const noteInput = wrap.querySelector('#txNote');
    const sugBox = wrap.querySelector('#noteSuggest');

    // ----- place + suggestions: your usual places are one tap away -----
    function showSuggestions(){
      if(sugsHidden || (editingTx && !noteFocused)){ sugBox.style.display = 'none'; return; }
      const list = noteSuggestions(state.transactions, txType, noteInput.value, allCats(txType).map(c=>c.id), 5);
      if(!list.length){ sugBox.style.display = 'none'; return; }
      sugBox.innerHTML = list.map((s, i)=>`<button type="button" class="sug" data-sug="${i}">${esc(s.note)}<small>${esc(fmt(s.amount))}</small></button>`).join('');
      sugBox.style.display = '';
      sugBox.querySelectorAll('.sug').forEach(b=>{
        b.onmousedown = (e)=> e.preventDefault();      // keeps the keyboard from flickering while you tap
        b.onclick = ()=> pick(list[Number(b.getAttribute('data-sug'))]);
      });
    }
    function pick(s){
      noteInput.value = s.note; noteVal = s.note; sugsHidden = true;
      if(!editingTx){
        if(s.category){
          category = s.category;
          wrap.querySelectorAll('#catGrid .cat-chip').forEach(c=>c.classList.toggle('active', c.getAttribute('data-cat') === category));
        }
        if(!(amountValue() > 0)){ digits = String(Math.round(s.amount)); touched = true; drawAmount(wrap); }
      }
      noteInput.blur();
      showSuggestions();
    }
    noteInput.onfocus = ()=>{ noteFocused = true; sugsHidden = false; sheetEl.classList.add('typing'); showSuggestions(); };
    noteInput.oninput = ()=>{ noteVal = noteInput.value; sugsHidden = false; showSuggestions(); };
    noteInput.onblur = ()=>{ noteFocused = false; sheetEl.classList.remove('typing'); if(editingTx) showSuggestions(); };
    noteInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); noteInput.blur(); } };
    showSuggestions();

    // ----- type, category, person, date, account -----
    wrap.querySelector('#addClose').onclick = ()=> closeSheet(wrap);
    wrap.querySelectorAll('#txTypeSeg button').forEach(b=>{
      b.onclick = ()=>{
        const next = b.getAttribute('data-val');
        if(next === txType) return;
        noteVal = noteInput.value; dateVal = wrap.querySelector('#txDate').value || dateVal;
        txType = next;
        category = mostUsedCategory(state.transactions, txType, allCats(txType)) || allCats(txType)[0].id;
        skipAccount = txType === 'expense' ? true : state.accounts.length === 0;
        sugsHidden = false;
        wrap.querySelector('#addBody').innerHTML = bodyHtml();
        bind(wrap);
      };
    });
    wrap.querySelectorAll('#catGrid .cat-chip').forEach(chip=>{
      chip.onclick = ()=>{ category = chip.getAttribute('data-cat'); wrap.querySelectorAll('#catGrid .cat-chip').forEach(c=>c.classList.toggle('active', c === chip)); };
    });
    wrap.querySelector('#personChip').onclick = ()=>{
      person = person === 'p1' ? 'p2' : 'p1';
      const dot = wrap.querySelector('#personChip .dot');
      dot.className = 'dot ' + person; dot.textContent = personInitial(person);
      wrap.querySelector('#personChipText').textContent = person === 'p1' ? state.settings.person1 : state.settings.person2;
    };
    wrap.querySelector('#txDate').onchange = (e)=>{
      dateVal = e.target.value || todayISO();
      wrap.querySelector('#dateChipText').textContent = shortDateLabel(dateVal);
    };
    const accChip = wrap.querySelector('#accChip');
    if(accChip){
      accChip.onclick = ()=> openAccountPickerSheet(accountId, skipAccount, txType, (id)=>{
        if(id === '__none__'){ skipAccount = true; } else { skipAccount = false; accountId = id; }
        const acc = state.accounts.find(a=>a.id === accountId);
        wrap.querySelector('#accChipText').textContent = (skipAccount || !acc) ? 'Account' : acc.name;
        accChip.classList.toggle('muted', skipAccount);
      });
    }

    // keep the chosen tile in view when it is further along the row
    const strip = wrap.querySelector('#catGrid'), on = wrap.querySelector('#catGrid .cat-chip.active');
    if(strip && on) strip.scrollLeft = Math.max(0, on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2);

    // ----- the number pad -----
    wrap.querySelectorAll('#keypad .add-key').forEach(b=>{ b.onclick = ()=> press(wrap, b.getAttribute('data-k')); });

    // ----- save (same rules as before) -----
    wrap.querySelector('#txSave').onclick = ()=>{
      const amount = amountValue();
      const note = noteInput.value.trim();
      const date = wrap.querySelector('#txDate').value || todayISO();
      if(!amount || amount <= 0){ wrap.querySelector('#txErr').textContent = 'Enter an amount greater than 0.'; return; }
      let acc = null;
      if(!skipAccount && state.accounts.length){
        acc = state.accounts.find(a=>a.id === accountId);
        if(!acc){ wrap.querySelector('#txErr').textContent = 'Select an account.'; return; }
      }
      if(editingTx){
        const oldAcc = state.accounts.find(a=>a.id === editingTx.accountId);
        if(oldAcc){ oldAcc.balance = Number(oldAcc.balance) - (editingTx.type === 'income' ? Number(editingTx.amount) : -Number(editingTx.amount)); }
        if(acc){ acc.balance = Number(acc.balance) + (txType === 'income' ? amount : -amount); }
        editingTx.type = txType; editingTx.amount = amount; editingTx.category = category; editingTx.person = person;
        editingTx.accountId = acc ? acc.id : null; editingTx.note = note; editingTx.date = date;
      } else {
        state.transactions.push({ id: uid(), type: txType, amount, category, person, accountId: acc ? acc.id : null, note, date, createdAt: Date.now() });
        if(acc){ acc.balance = Number(acc.balance) + (txType === 'income' ? amount : -amount); }
        rememberPerson(person);
        if(opts.recurringId){
          const rr = (state.recurring || []).find(x=>x.id === opts.recurringId);
          if(rr) rr.nextDue = nextOccurrence(rr, rr.nextDue);
        }
      }
      saveState(); render(); closeSheet(wrap);
    };
  }
}

function openAddBudgetSheet(){

  if(available.length===0){
    showSheet(`<div class="sheet-title">Add budget</div><div class="empty-state">Every category already has a budget.</div>`);
    return;
  }
  let category = available[0].id;
  const html = `
    <div class="sheet-title">Add budget</div>
    <label class="field-label" style="margin-top:0">Category</label>
    <div class="cat-grid" id="bCatGrid">
      ${available.map(c=>`<div class="cat-chip ${c.id===category?'active':''}" data-cat="${c.id}"><div class="ic">${catIconHtml(c, 19)}</div><div class="lb">${c.label}</div></div>`).join('')}

    <label class="field-label">Monthly limit</label>

  `;
  showSheet(html, (wrap)=>{
    wrap.querySelectorAll('#bCatGrid .cat-chip').forEach(chip=>{

    });

function openEditBudgetSheet(budgetId){
  const b = state.budgets.find(x=>x.id===budgetId);
  if(!b) return;
  const info = catInfo('expense', b.category);
  const html = `
    <div class="sheet-title">${catIconHtml(info, 22)} ${info.label} budget</div>
    <label class="field-label" style="margin-top:0">Monthly limit</label>
    <div class="amount-input-wrap"><span>${state.settings.currency}</span><input type="number" id="bLimit" value="${b.limit}" inputmode="decimal"></div>
    <div class="field-error" id="bErr"></div>
    <button class="btn-primary" id="bSave">Save changes</button>
    <button class="btn-text-danger" id="bDelete">Delete budget</button>
  `;
  showSheet(html, (wrap)=>{
    wrap.querySelector('#bSave').onclick = ()=>{
      const limit = parseFloat(wrap.querySelector('#bLimit').value || '0');
      if(!limit || limit<=0){ wrap.querySelector('#bErr').textContent = 'Enter a limit greater than 0.'; return; }
      b.limit = limit;
      saveState(); render(); closeSheet(wrap);
    };
    wrap.querySelector('#bDelete').onclick = ()=>{
      const idx = state.budgets.findIndex(x=>x.id===budgetId);
      const removed = idx >= 0 ? state.budgets[idx] : null;
      state.budgets = state.budgets.filter(x=>x.id!==budgetId);
      saveState(); render(); closeSheet(wrap);
      if(removed) showUndoToast('Budget deleted', ()=>{
        state.budgets.splice(Math.min(idx, state.budgets.length), 0, removed);
        saveState(); render();
      });
    };
  });
}

// ---------- SPEND FILTER ----------
function openSpendFilterSheet(hideCategories){
  let range = ui.spendFilter.range;
  let customStart = ui.spendFilter.customStart;
  let customEnd = ui.spendFilter.customEnd;
  let categories = [...ui.spendFilter.categories];

  const RANGE_OPTIONS = [
    {id:'this_month', label:'This month'},
    {id:'last_month', label:'Last month'},
    {id:'this_year', label:'This year'},
    {id:'custom', label:'Custom range'},
  ];

  function bodyHtml(){
    return `
      <label class="field-label" style="margin-top:0">Date range</label>
      <div class="account-pick" id="rangePick">
        ${RANGE_OPTIONS.map(r=>`<div class="account-pick-item ${r.id===range?'active':''}" data-range="${r.id}"><span class="n">${r.label}</span></div>`).join('')}
      </div>
      ${range==='custom' ? `
      <label class="field-label">From</label>
      <div class="date-field-wrap"><input type="date" id="customStart" value="${customStart||''}"></div>
      <label class="field-label">To</label>
      <div class="date-field-wrap"><input type="date" id="customEnd" value="${customEnd||''}"></div>
      ` : ''}
      ${!hideCategories ? `
      <label class="field-label">Categories</label>
      <div class="cat-grid" id="catFilterGrid">
        <div class="cat-chip ${categories.length===0?'active':''}" data-cat="__all__"><div class="ic">${icn('sparks')}</div><div class="lb">All</div></div>
        ${state.categories.expense.map(c=>`<div class="cat-chip ${categories.includes(c.id)?'active':''}" data-cat="${c.id}"><div class="ic">${catIconHtml(c, 19)}</div><div class="lb">${c.label}</div></div>`).join('')}
      </div>
      ` : ''}
      <button class="btn-primary" id="filterApply">Apply filter</button>
    `;
  }

  const wrap = showSheet(`<div class="sheet-title">Filter</div><div id="filterBody">${bodyHtml()}</div>`, (w)=>bind(w));

  function bind(wrap){
    wrap.querySelectorAll('#rangePick .account-pick-item').forEach(item=>{
      item.onclick = ()=>{
        range = item.getAttribute('data-range');
        wrap.querySelector('#filterBody').innerHTML = bodyHtml();
        bind(wrap);
      };
    });
    const csInput = wrap.querySelector('#customStart');
    const ceInput = wrap.querySelector('#customEnd');
    if(csInput) csInput.oninput = ()=>{ customStart = csInput.value; };
    if(ceInput) ceInput.oninput = ()=>{ customEnd = ceInput.value; };
    wrap.querySelectorAll('#catFilterGrid .cat-chip').forEach(chip=>{
      chip.onclick = ()=>{
        const catId = chip.getAttribute('data-cat');
        const allChip = wrap.querySelector('#catFilterGrid .cat-chip[data-cat="__all__"]');
        if(catId === '__all__'){
          categories = [];
          wrap.querySelectorAll('#catFilterGrid .cat-chip').forEach(c=>c.classList.remove('active'));
          allChip.classList.add('active');
        } else {
          const idx = categories.indexOf(catId);
          if(idx >= 0){ categories.splice(idx,1); chip.classList.remove('active'); }
          else { categories.push(catId); chip.classList.add('active'); }
          if(categories.length===0) allChip.classList.add('active'); else allChip.classList.remove('active');
        }
      };
    });
    wrap.querySelector('#filterApply').onclick = ()=>{
      ui.spendFilter = { range, customStart, customEnd, categories };
      render();
      closeSheet(wrap);
    };
  }
}

  function refresh(w){
    render();
    w.querySelector('#periodSheetBody').innerHTML = bodyHtml();

function openEditCategorySheet(type, catId){
  const cats = allCats(type);
  const existing = catId ? cats.find(c=>c.id===catId) : null;
  let iconKey = existing ? catIconKey(existing) : 'cart';
  const pickerKeys = ICON_PICKER.includes(iconKey) ? ICON_PICKER : [iconKey].concat(ICON_PICKER);
  const html = `
    ${sheetNavHtml(existing ? 'Edit category' : 'Add category', true)}
    <label class="field-label" style="margin-top:0">Name</label>
    <input type="text" id="catName" value="${existing ? esc(existing.label) : ''}" placeholder="e.g. Groceries">
    <label class="field-label">Icon</label>

    ${existing ? `<button class="btn-text-danger" id="catDelete">Delete category</button>` : ''}
  `;
  showSheet(html, (wrap)=>{
    wireSheetBack(wrap, ()=>openManageCategoriesSheet(type));
    wrap.querySelectorAll('#catIconGrid .icon-opt').forEach(b=>{
      b.onclick = ()=>{ iconKey = b.getAttribute('data-icon'); wrap.querySelectorAll('#catIconGrid .icon-opt').forEach(x=>x.classList.toggle('sel', x === b)); };
    });
    wrap.querySelector('#catSave').onclick = ()=>{
      const name = wrap.querySelector('#catName').value.trim();
      if(!name){ wrap.querySelector('#catErr').textContent = 'Enter a category name.'; return; }
      const emoji = ICON_EMOJI[iconKey] || '📦';   // kept so a phone that is not updated yet still shows something
      if(existing){
        existing.iconKey = iconKey; existing.icon = emoji; existing.label = name;
      } else {
        state.categories[type].push({ id: uid(), label: name, icon: emoji, iconKey });
      }
      saveState(); render(); closeSheet(wrap);
      openManageCategoriesSheet(type);
    };
    if(existing){
      wrap.querySelector('#catDelete').onclick = ()=>{
        const idx = state.categories[type].findIndex(c=>c.id===existing.id);
        const removed = state.categories[type][idx];
        state.categories[type] = state.categories[type].filter(c=>c.id!==existing.id);
        saveState(); render(); closeSheet(wrap);
        openManageCategoriesSheet(type);
        showUndoToast('Category deleted', ()=>{
          state.categories[type].splice(Math.min(idx, state.categories[type].length), 0, removed);
          saveState(); render();
        });
      };
    }
  });
}

function recapMonthForFilter(){
  const now = new Date();
  if(ui.spendFilter.range === 'last_month') return prevMonthOf(now.getFullYear(), now.getMonth() + 1);
  return { y: now.getFullYear(), m: now.getMonth() + 1 };
}

function openMonthRecapSheet(y0, m0){
  let y = y0, m = m0;
  const now = new Date(), curY = now.getFullYear(), curM = now.getMonth() + 1;
  const canPrev = ()=>{ const e = earliestMonth(state.transactions); return !!e && (y > e.y || (y === e.y && m > e.m)); };
  const canNext = ()=> y < curY || (y === curY && m < curM);
  const pct = (part, whole)=> whole > 0 ? Math.round(part / whole * 100) : 0;
  const shortDate = (iso)=> parseISODate(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

  function bodyHtml(){
    const r = monthRecap(state.transactions, state.budgets, y, m);
    if(!r.hasData) return `<div class="empty-state">No entries in ${esc(monthLabel(y, m))}.</div>`;
    const ch = r.compare.change;
    let cmpLine = '';
    if(ch){
      const lead = ch.arrow === '≈' ? '≈ Flat vs' : `${ch.arrow} ${ch.text} vs`;
      cmpLine = `<div class="spend-cmp ${ch.tone}" style="margin-top:6px;">${lead} ${r.compare.sameDays ? 'the same days in ' : ''}${esc(monthName(r.compare.prevM))}</div>`;
    } else if(r.compare.prev === 0 && !r.isFuture){
      cmpLine = `<div class="spend-cmp flat" style="margin-top:6px;">No spending in ${esc(monthName(r.compare.prevM))} to compare</div>`;
    }
    let h = `<div class="recap-hero">
      <div class="recap-total">${fmt(r.total)}</div>
      <div class="recap-sub">${r.isCurrent ? 'spent so far this month' : 'spent in ' + esc(monthName(m))} · ${r.entries} ${r.entries === 1 ? 'entry' : 'entries'}</div>
      ${cmpLine}
    </div>
    <div class="recap-grid">
      <div class="recap-stat"><span>Daily average</span><b>${fmt(r.dailyAvg)}</b></div>
      <div class="recap-stat"><span>Income</span><b>${fmt(r.income)}</b></div>
      <div class="recap-stat"><span>${esc(state.settings.person1)}</span><b>${fmt(r.byPerson.p1)}</b><small>${pct(r.byPerson.p1, r.total)}% of spending</small></div>
      <div class="recap-stat"><span>${esc(state.settings.person2)}</span><b>${fmt(r.byPerson.p2)}</b><small>${pct(r.byPerson.p2, r.total)}% of spending</small></div>
    </div>`;
    if(r.biggest){
      const bi = catInfo('expense', r.biggest.category);
      h += `<div class="recap-card"><div class="recap-card-title">Biggest purchase</div>
        <div class="recap-line"><span class="recap-line-ic">${catIconHtml(bi, 20)}</span><div class="recap-line-mid"><b>${esc(r.biggest.note || bi.label)}</b><small>${esc(shortDate(r.biggest.date))} · ${esc(personName(r.biggest.person))}</small></div><span class="amt">${fmt(r.biggest.amount)}</span></div>
      </div>`;
    }
    if(r.topCategory){
      const ti = catInfo('expense', r.topCategory.id);
      let lines = `<div class="recap-line"><span class="recap-line-ic">${catIconHtml(ti, 24)}</span><div class="recap-line-mid"><b>${esc(ti.label)}</b><small>Most spent on · ${Math.round(r.topCategory.share * 100)}% of spending</small></div><span class="amt">${fmt(r.topCategory.total)}</span></div>`;
      if(r.biggestChange){
        const bc = r.biggestChange, ci = catInfo('expense', bc.id), up = bc.delta > 0;
        lines += `<div class="recap-line"><span class="recap-line-ic">${catIconHtml(ci, 24)}</span><div class="recap-line-mid"><b>${esc(ci.label)}</b><small>Biggest change · ${up ? 'up' : 'down'} vs ${r.compare.sameDays ? 'the same days in ' : ''}${esc(monthName(r.compare.prevM))}</small></div><span class="amt ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${fmt(Math.abs(bc.delta))}</span></div>`;
      }
      h += `<div class="recap-card"><div class="recap-card-title">Where it went</div>${lines}</div>`;
    }
    if(r.places.length){
      h += `<div class="recap-card"><div class="recap-card-title">Top places</div>${r.places.map(p=>`<div class="recap-line tap" data-recapplace="${esc(p.name)}"><div class="recap-line-mid"><b>${esc(p.name)}</b><small>${p.count} ${p.count === 1 ? 'visit' : 'visits'}</small></div><span class="amt">${fmt(p.total)}</span></div>`).join('')}</div>`;
    }
    if(r.budgets.length){
      h += `<div class="recap-card"><div class="recap-card-title">Budgets</div>${r.budgets.map(b=>{
        const bi = catInfo('expense', b.category), over = b.status === 'over';
        const w = Math.min(100, Math.round(b.pct * 100));
        const status = over ? `Over by ${fmt(b.over)}` : (r.isCurrent ? 'Within budget so far' : 'Within budget');
        return `<div class="recap-budget"><div class="recap-budget-top"><span>${catIconHtml(bi, 20)} ${esc(bi.label)}</span><span><b>${fmt(b.spent)}</b> / ${fmt(b.limit)}</span></div>
          <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${w}%; background:${over ? 'var(--red)' : (b.pct > 0.8 ? 'var(--orange)' : 'var(--green)')}"></div></div>
          <div class="recap-budget-status ${over ? 'over' : ''}">${status}</div></div>`;
      }).join('')}</div>`;
    }
    h += `<button class="btn-secondary" id="recapSeeAll">See all entries this month</button>`;
    return h;
  }

  showSheet(`<div class="sheet-title">Monthly recap</div>
    <div class="period-nav-sheet"><button class="period-btn-lg" id="recapPrev" aria-label="Earlier month">‹</button><div class="period-label-lg" id="recapLabel"></div><button class="period-btn-lg" id="recapNext" aria-label="Later month">›</button></div>
    <div id="recapBody"></div>`, (wrap)=>{
    function draw(){
      wrap.querySelector('#recapLabel').textContent = monthLabel(y, m);
      wrap.querySelector('#recapPrev').disabled = !canPrev();
      wrap.querySelector('#recapNext').disabled = !canNext();
      wrap.querySelector('#recapBody').innerHTML = bodyHtml();
      wrap.querySelectorAll('[data-recapplace]').forEach(row=>{
        row.onclick = ()=>{
          closeSheet(wrap);
          openHistoryWithFilter({ query: row.getAttribute('data-recapplace'), range: 'custom', customStart: monthStartISO(y, m), customEnd: monthEndISO(y, m), type: 'expense' });
        };
      });
      const all = wrap.querySelector('#recapSeeAll');
      if(all) all.onclick = ()=>{ closeSheet(wrap); openHistoryWithFilter({ range: 'custom', customStart: monthStartISO(y, m), customEnd: monthEndISO(y, m), type: 'expense' }); };
    }
    wrap.querySelector('#recapPrev').onclick = ()=>{ if(!canPrev()) return; const p = prevMonthOf(y, m); y = p.y; m = p.m; draw(); };
    wrap.querySelector('#recapNext').onclick = ()=>{ if(!canNext()) return; m++; if(m > 12){ m = 1; y++; } draw(); };
    draw();
  });
}

function skipDue(id){
  const r = (state.recurring || []).find(x=>x.id === id);
  if(!r) return;
  const before = r.nextDue;
  r.nextDue = nextOccurrence(r, r.nextDue);
  saveState(); render();
  const label = r.note || catInfo(r.type, r.category).label;
  showUndoToast('Skipped ' + label, ()=>{
    const again = (state.recurring || []).find(x=>x.id === id);
    if(again){ again.nextDue = before; saveState(); render(); }
  });
}
